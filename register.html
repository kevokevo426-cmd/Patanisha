<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete Your Profile - Patanisha</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{background:linear-gradient(135deg,#FFD700,#FFA500);min-height:100vh;padding:20px}
.container{max-width:500px;margin:0 auto;background:white;border-radius:20px;padding:25px;box-shadow:0 10px 30px rgba(0,0,0,0.2)}
h2{text-align:center;color:#FF8C00;margin-bottom:10px}
.subtitle{text-align:center;color:#666;font-size:14px;margin-bottom:20px}
.avatar-upload{text-align:center;margin:20px 0}
.avatar-preview{width:120px;height:120px;border-radius:50%;border:4px solid #FFD700;margin:0 auto 10px;object-fit:cover;background:#f5f5f5}
.upload-btn{background:#FFA500;color:white;border:none;padding:10px 20px;border-radius:20px;cursor:pointer;font-weight:bold}
.form-group{margin-bottom:15px}
.form-group label{display:block;margin-bottom:5px;font-weight:600;color:#333;font-size:14px}
.form-group input,.form-group textarea{width:100%;padding:12px;border:2px solid #eee;border-radius:12px;font-size:14px}
.form-group textarea{resize:none;height:80px}
.hobbies{display:flex;gap:8px;flex-wrap:wrap}
.hobby-tag{padding:8px 15px;background:#f5f5f5;border-radius:20px;cursor:pointer;border:2px solid transparent;font-size:13px}
.hobby-tag.active{background:#FFD700;border-color:#FFA500}
.photo-upload{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:10px 0}
.photo-box{aspect-ratio:1;border:2px dashed #ddd;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;background:#f9f9f9;position:relative}
.photo-box img{width:100%;height:100%;object-fit:cover}
.photo-box span{font-size:30px;color:#ccc}
.btn-submit{width:100%;background:linear-gradient(135deg,#FF5252,#FF1744);color:white;border:none;padding:15px;border-radius:15px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:20px}
</style>
</head>
<body>
<div class="container">
  <h2>💃 Complete Your Profile</h2>
  <p class="subtitle">This helps guys find and connect with you</p>

  <div class="avatar-upload">
    <img src="https://via.placeholder.com/120" id="avatarPreview" class="avatar-preview">
    <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="previewAvatar(event)">
    <button class="upload-btn" onclick="document.getElementById('avatarInput').click()">Upload Avatar</button>
  </div>

  <div class="form-group">
    <label>Display Name *</label>
    <input type="text" id="name" placeholder="e.g. Breezy 🔥">
  </div>

  <div class="form-group">
    <label>Age *</label>
    <input type="number" id="age" placeholder="20" min="18" max="60">
  </div>

  <div class="form-group">
    <label>City *</label>
    <input type="text" id="city" placeholder="e.g. Ruiru">
  </div>

  <div class="form-group">
    <label>About Me / Bio</label>
    <textarea id="bio" placeholder="Tell guys about yourself..."></textarea>
  </div>

  <div class="form-group">
    <label>Interests / Hobbies - Tap to select</label>
    <div class="hobbies" id="hobbiesList">
      <div class="hobby-tag" onclick="toggleHobby(this)">Travel</div>
      <div class="hobby-tag" onclick="toggleHobby(this)">Music</div>
      <div class="hobby-tag" onclick="toggleHobby(this)">Gym</div>
      <div class="hobby-tag" onclick="toggleHobby(this)">Cooking</div>
      <div class="hobby-tag" onclick="toggleHobby(this)">Dancing</div>
      <div class="hobby-tag" onclick="toggleHobby(this)">Movies</div>
      <div class="hobby-tag" onclick="toggleHobby(this)">Shopping</div>
      <div class="hobby-tag" onclick="toggleHobby(this)">Coffee</div>
    </div>
  </div>

  <div class="form-group">
    <label>Upload 3 Photos</label>
    <div class="photo-upload">
      <div class="photo-box" onclick="uploadPhoto(0)"><span>+</span><img id="photo0" style="display:none"></div>
      <div class="photo-box" onclick="uploadPhoto(1)"><span>+</span><img id="photo1" style="display:none"></div>
      <div class="photo-box" onclick="uploadPhoto(2)"><span>+</span><img id="photo2" style="display:none"></div>
    </div>
    <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="previewPhoto(event)">
  </div>

  <button class="btn-submit" onclick="saveProfile()">Save & Go to Home</button>
</div>

<script>
let selectedHobbies = [];
let uploadedPhotos = [null,null];
let currentPhotoIndex = 0;

function previewAvatar(e){
  let file = e.target.files[0];
  let reader = new FileReader();
  reader.onload = function(ev){document.getElementById('avatarPreview').src = ev.target.result}
  reader.readAsDataURL(file);
}

function toggleHobby(el){
  el.classList.toggle('active');
  let hobby = el.innerText;
  if(selectedHobbies.includes(hobby)) selectedHobbies = selectedHobbies.filter(h=>h!=hobby);
  else selectedHobbies.push(hobby);
}

function uploadPhoto(index){
  currentPhotoIndex = index;
  document.getElementById('photoInput').click();
}

function previewPhoto(e){
  let file = e.target.files[0];
  let reader = new FileReader();
  reader.onload = function(ev){
    document.getElementById('photo'+currentPhotoIndex).src = ev.target.result;
    document.getElementById('photo'+currentPhotoIndex).style.display = 'block';
    uploadedPhotos[currentPhotoIndex] = ev.target.result;
  }
  reader.readAsDataURL(file);
}

function saveProfile(){
  let profile = {
    name: document.getElementById('name').value,
    age: document.getElementById('age').value,
    city: document.getElementById('city').value,
    bio: document.getElementById('bio').value,
    hobbies: selectedHobbies,
    avatar: document.getElementById('avatarPreview').src,
    photos: uploadedPhotos.filter(p=>p!=null),
    gender: 'female',
    friends: 0,
    level: 1,
    distance: "1km",
    svip: ""
  };

  if(!profile.name ||!profile.age ||!profile.city) return alert('Please fill Name, Age and City');

  let users = JSON.parse(localStorage.getItem('patanishaUsers')) || [];
  users.push(profile);
  localStorage.setItem('patanishaUsers', JSON.stringify(users));
  localStorage.setItem('myProfile', JSON.stringify(profile));

  alert('Profile Saved! Welcome to Patanisha');
  window.location.href = '/';
}
</script>
</body>
</html>
