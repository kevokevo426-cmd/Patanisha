<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Patanisha</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body class="bg-black">
  <div class="text-white text-center p-8 max-w-md mx-auto min-h-screen flex-col justify-center">
    <h1 class="text-pink-500 text-4xl font-bold mb-8">Patanisha ❤️</h1>
    <p class="text-gray-400 mb-4">Connect, Chat, and Earn</p>
    
    <input id="email" type="email" placeholder="Email" class="w-full p-3 mt-4 bg-gray-800 rounded text-white border-gray-700 focus:border-pink-500 outline-none">
    <input id="pass" type="password" placeholder="Password" class="w-full p-3 mt-3 bg-gray-800 rounded text-white border-gray-700 focus:border-pink-500 outline-none">
    
    <button onclick="signup()" class="bg-pink-500 w-full py-3 rounded mt-6 font-bold hover:bg-pink-600">Sign Up</button>
    <button onclick="login()" class="bg-gray-600 w-full py-3 rounded mt-3 hover:bg-gray-700">Login</button>
    
    <p id="error" class="text-red-500 mt-4 text-sm"></p>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAXwKw7n28LiJx2W4PBkQG7_glL0sVog8M",
      authDomain: "patanisha-49561.firebaseapp.com",
      projectId: "patanisha-49561",
      storageBucket: "patanisha-49561.firebasestorage.app",
      messagingSenderId: "363879415134",
      appId: "1:363879415134:web:81b99ab93290a3e45723cf"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // If already logged in, go to main app
    auth.onAuthStateChanged(user => { 
      if(user) window.location.href = "index.html"; 
    });
    
    async function signup(){ 
      document.getElementById('error').innerText = "";
      const email = document.getElementById('email').value; 
      const pass = document.getElementById('pass').value; 
      try {
        const cred = await auth.createUserWithEmailAndPassword(email, pass);
        // Create user data in Firestore
        await db.collection("users").doc(cred.user.uid).set({
          username: "User" + Math.floor(Math.random()*9999),
          userId: "PT" + Math.floor(Math.random()*900000 + 100000),
          photo: `https://i.pravatar.cc/150?u=${cred.user.uid}`,
          coins: 6, diamonds: 10, friends: 0, following: 0, followers: 0, visitors: 0,
          totalIncome: 0, todayIncome: 0
        });
      } catch(e) {
        document.getElementById('error').innerText = e.message;
      }
    }

    function login(){ 
      document.getElementById('error').innerText = "";
      const email = document.getElementById('email').value; 
      const pass = document.getElementById('pass').value; 
      auth.signInWithEmailAndPassword(email, pass).catch(e => {
        document.getElementById('error').innerText = e.message;
      }); 
    }
  </script>
</body>
</html>
