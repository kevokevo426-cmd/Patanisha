<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patanisha Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body class="bg-black">
  <div id="root"></div>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAXwKw7n28LiJx2W4PBkQG7_glL0sVog8M",
      authDomain: "patanisha-49561.firebaseapp.com",
      projectId: "patanisha-49561",
      storageBucket: "patanisha-49561.firebasestorage.app",
      messagingSenderId: "363879415134",
      appId: "1:363879415134:web:81b99ab93290a3e45723cf"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // If already logged in, go to home
    auth.onAuthStateChanged((user) => {
      if (user) {
        window.location.href = 'index.html';
      } else {
        showLogin();
      }
    });

    function showLogin(){
      document.getElementById('root').innerHTML = `
      <div class="text-white text-center p-8 max-w-md mx-auto min-h-screen flex flex-col justify-center">
        <h1 class="text-pink-500 text-5xl font-bold mb-2">Patanisha ❤️</h1>
        <p class="text-gray-400 mb-8">Connect, Chat, Earn</p>
        <input id="email" type="email" placeholder="Email" class="w-full p-3 mt-4 bg-gray-800 rounded text-white border border-gray-700">
        <input id="pass" type="password" placeholder="Password" class="w-full p-3 mt-3 bg-gray-800 rounded text-white border border-gray-700">
        <button onclick="signup()" class="bg-pink-500 w-full py-3 rounded mt-6 font-bold">Sign Up</button>
        <button onclick="login()" class="bg-gray-700 w-full py-3 rounded mt-3">Login</button>
      </div>`;
    }
    function signup(){ 
      const email = document.getElementById('email').value; 
      const pass = document.getElementById('pass').value; 
      auth.createUserWithEmailAndPassword(email, pass).catch(e => alert(e.message)); 
    }
    function login(){ 
      const email = document.getElementById('email').value; 
      const pass = document.getElementById('pass').value; 
      auth.signInWithEmailAndPassword(email, pass).catch(e => alert(e.message)); 
    }
  </script>
</body>
</html>
