const avatarPool = [
  "https://i.pravatar.cc/60?img=11",
  "https://i.pravatar.cc/60?img=12",
  "https://i.pravatar.cc/60?img=13",
  "https://i.pravatar.cc/60?img=14",
  "https://i.pravatar.cc/60?img=15"
];

function shuffleAvatars(){
  let shuffled = [...avatarPool].sort(() => 0.5 - Math.random());
  let selected = shuffled.slice(0, 4);
  let html = '';
  selected.forEach(src => {
    html += `<img src="${src}">`;
  });
  document.getElementById('randomAvatars').innerHTML = html;
}
window.addEventListener('load', shuffleAvatars);

let userData = {};let selectedGender = '';let tempGender = '';let selectedHobbies = [];let uploadedPhotos = [];
const MAX_HOBBIES = 5;const MAX_PHOTOS = 5;

const hobbiesData = {
  "Creativity": ["Painting","Singing","Makeup","Crafts","Writing","Design"],
  "Sports": ["Ping pong","Volleyball","Swimming","Gymnastics","Bodybuilding","Athletics","Yoga"],
  "Outdoor": ["Hiking","Camping","Surfing","Dancing","Concerts","Karaoke"],
  "At home": ["Cooking","Reading","Gardening","DIY","Board games","Video games"],
  "Movies and TV shows": ["Action & Adventure","Comedy","Drama","Documentaries","Horror","Romance"],
  "Reading": ["Fiction","Non-fiction","Self-help","Biographies","Poetry","Mystery"],
  "Music": ["Pop","Rock","Hip hop","Jazz","Classical","Electronic"],
  "Food": ["Baking","Coffee","Tea","Pizza","Sushi","BBQ","Vegetarian","Vegan"],
  "Pets": ["Dogs","Cats","Birds","Fish","Rabbits","Reptiles"],
  "Values and Personality": ["Honesty","Kindness","Ambition","Creativity","Loyalty","Open-mindedness"]
};

function togglePassword(id, el){
  const input = document.getElementById(id);
  if(input.type === "password"){input.type = "text";el.innerText = "🙈";}
  else{input.type = "password";el.innerText = "👁️";}
}

function openTerms(e){
  e.preventDefault();
  document.getElementById('termsBody').innerText=KE_TERMS; // FIXED THIS LINE
  document.getElementById('termsModal').style.display='flex';
  document.getElementById('acceptTermsBtn').disabled = true;
}
function checkScroll(){
  const el = document.getElementById('termsBody');
  if(el.scrollTop + el.clientHeight >= el.scrollHeight - 5){
    document.getElementById('acceptTermsBtn').disabled = false;
  }
}
function acceptTerms(){
  document.getElementById('termsCheck').disabled = false;
  document.getElementById('termsCheck').checked = true;
  closeTerms();
}
function closeTerms(){document.getElementById('termsModal').style.display='none';}

function switchAuth(type){
  document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab-auth').forEach(t=>t.classList.remove('active'));
  if(type === 'signin'){
    document.getElementById('signinStep').classList.add('active');
    document.getElementById('tabSignIn').classList.add('active');
  }else{
    document.getElementById('step1').classList.add('active');
    document.getElementById('tabSignUp').classList.add('active');
  }
}

function doSignIn(){
  const email = document.getElementById('loginEmail').value;
  const pass = document.getElementById('loginPassword').value;
  document.getElementById('loginEmailError').style.display = 'none';
  document.getElementById('loginPassError').style.display = 'none';
  if(!email){document.getElementById('loginEmailError').style.display = 'block';return;}
  if(!pass){document.getElementById('loginPassError').style.display = 'block';return;}
  const savedProfile = JSON.parse(localStorage.getItem('patanisha_myProfile'));
  if(savedProfile && savedProfile.email === email && savedProfile.password === pass){
    alert('Welcome back ' + savedProfile.name + '!');
    if(savedProfile.gender === 'Male') window.location.href = 'male.html';
    else window.location.href = 'female.html';
  }else{
    alert('Invalid email or password. Please Sign Up first.');
  }
}

function askGenderConfirm(gender){
  tempGender = gender;
  document.getElementById('confirmText').innerText = `Are you sure you want to select ${gender}?`;
  document.getElementById('genderConfirm').style.display = 'flex';
}
function closeConfirm(){document.getElementById('genderConfirm').style.display = 'none';}
function confirmGender(){
  selectedGender = tempGender;
  document.querySelectorAll('.gender-card').forEach(b=>b.classList.remove('selected'));
  if(tempGender === 'Male') document.querySelectorAll('.gender-card')[0].classList.add('selected');
  if(tempGender === 'Female') document.querySelectorAll('.gender-card')[1].classList.add('selected');
  document.getElementById('genderError').style.display = 'none';
  closeConfirm();
}

function goToStep2(){
  let valid = true;
  const email = document.getElementById('email').value;
  const pass = document.getElementById('password').value;
  const confirmPass = document.getElementById('confirmPassword').value;
  const terms = document.getElementById('termsCheck').checked;
  document.getElementById('emailError').style.display = 'none';
  document.getElementById('passError').style.display = 'none';
  document.getElementById('confirmPassError').style.display = 'none';
  document.getElementById('genderError').style.display = 'none';
  document.getElementById('termsError').style.display = 'none';
  if(!email.includes('@')) {document.getElementById('emailError').style.display = 'block';valid = false;}
  if(pass.length < 6) {document.getElementById('passError').style.display = 'block';valid = false;}
  if(pass!== confirmPass) {document.getElementById('confirmPassError').style.display = 'block';valid = false;}
  if(!selectedGender) {document.getElementById('genderError').style.display = 'block';valid = false;}
  if(!terms) {document.getElementById('termsError').style.display = 'block';valid = false;}
  if(!valid) return;
  userData.email = email;userData.password = pass;userData.gender = selectedGender;userData.inviteCode = document.getElementById('inviteCode').value;
  document.getElementById('step1').classList.remove('active');document.getElementById('step2').classList.add('active');
}

function goToStep3(){
  userData.name = document.getElementById('name').value;
  userData.dob = document.getElementById('dob').value;
  userData.city = document.getElementById('city').value;
  userData.bio = document.getElementById('bio').value;
  if(!userData.name ||!userData.dob ||!userData.city){alert('Please fill Name, DOB and City');return;}
  let age = new Date().getFullYear() - new Date(userData.dob).getFullYear();
  userData.age = age;
  renderHobbies();
  document.getElementById('step2').classList.remove('active');document.getElementById('step3').classList.add('active');
}

function renderHobbies(){
  let html = '';
  Object.keys(hobbiesData).forEach(cat=>{
    html += `<div class="hobby-category"><div class="category-title">${cat}</div><div class="hobby-tags">`;
    hobbiesData[cat].forEach(hobby=>{
      html += `<div class="hobby-tag" onclick="toggleHobby(this,'${hobby}')">${hobby}</div>`;
    });
    html += `</div></div>`;
  });
  document.getElementById('hobbiesList').innerHTML = html;
}
function toggleHobby(el,hobby){
  if(el.classList.contains('selected')){el.classList.remove('selected');selectedHobbies = selectedHobbies.filter(h=>h!==hobby);}
  else{if(selectedHobbies.length >= MAX_HOBBIES) return;el.classList.add('selected');selectedHobbies.push(hobby);}
  document.getElementById('hobbyCounter').innerText = `${selectedHobbies.length}/${MAX_HOBBIES}`;
  document.querySelectorAll('.hobby-tag').forEach(tag=>{if(selectedHobbies.length >= MAX_HOBBIES &&!tag.classList.contains('selected')) tag.classList.add('disabled');else tag.classList.remove('disabled');});
}

function skipHobbies(){selectedHobbies=[];goToStep4();}
function goToStep4(){
  if(selectedHobbies.length!==0 && selectedHobbies.length!== MAX_HOBBIES){alert(`Please select exactly ${MAX_HOBBIES} hobbies or Skip`);return;}
  userData.hobbies = selectedHobbies;document.getElementById('step3').classList.remove('active');document.getElementById('step4').classList.add('active');
}
function goBack(step){document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));document.getElementById(`step${step}`).classList.add('active');}

document.getElementById('avatar').onchange = function(e){let file = e.target.files[0];if(file){let reader = new FileReader();reader.onload = function(ev){document.getElementById('avatarPrev').src = ev.target.result;userData.avatar = ev.target.result;};reader.readAsDataURL(file);}}
document.getElementById('avatarPrev').onclick = ()=>document.getElementById('avatar').click();

document.getElementById('photoInput').onchange = function(e){let file = e.target.files[0];if(file && uploadedPhotos.length < MAX_PHOTOS){let reader = new FileReader();reader.onload = function(ev){uploadedPhotos.push(ev.target.result);renderPhotos();};reader.readAsDataURL(file);}}
function addPhoto(){if(uploadedPhotos.length >= MAX_PHOTOS) return;document.getElementById('photoInput').click();}
function renderPhotos(){let grid = document.getElementById('photoGrid');grid.innerHTML = '';uploadedPhotos.forEach((src,idx)=>{grid.innerHTML += `<div class="photo-box"><img src="${src}"><div class="photo-box remove" onclick="removePhoto(${idx})">×</div></div>`;});if(uploadedPhotos.length < MAX_PHOTOS) grid.innerHTML += `<div class="photo-box" onclick="addPhoto()">+</div>`;document.getElementById('photoCount').innerText = `${uploadedPhotos.length}/${MAX_PHOTOS}`;}
function removePhoto(idx){uploadedPhotos.splice(idx,1);renderPhotos();}

function saveProfile(){
  userData.photos = uploadedPhotos;
  userData.id = 'PT' + Math.floor(Math.random()*900000+100000);
  userData.level = 1;
  userData.friends = [];
  userData.following = [];
  userData.followers = [];
  userData.visitors = [];
  userData.coins = 20;
  userData.distance = Math.floor(Math.random()*50)+1 + 'km';
  localStorage.setItem('patanisha_myProfile', JSON.stringify(userData));

  let users = JSON.parse(localStorage.getItem('patanishaUsers')) || [];
  users.push({name:userData.name,avatar:userData.avatar,friends:0,level:1,distance:userData.distance,age:userData.age,city:userData.city,gender:userData.gender,desc:userData.bio,hobbies:userData.hobbies});
  localStorage.setItem('patanishaUsers', JSON.stringify(users));

  alert('Profile Created Successfully!');

  if(userData.gender === 'Male'){
    window.location.href = 'male.html';
  } else {
    window.location.href = 'female.html';
  }
}
</script>
