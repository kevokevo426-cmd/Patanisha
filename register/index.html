const avatarPool = ["https://i.pravatar.cc/60?img=11","https://i.pravatar.cc/60?img=12","https://i.pravatar.cc/60?img=13","https://i.pravatar.cc/60?img=14","https://i.pravatar.cc/60?img=15"];
function shuffleAvatars(){let shuffled=[...avatarPool].sort(()=>0.5-Math.random());let selected=shuffled.slice(0,4);let html='';selected.forEach(src=>{html+=`<img src="${src}">`;});document.getElementById('randomAvatars').innerHTML=html;}
window.addEventListener('load',shuffleAvatars);
let userData={},selectedGender='',tempGender='',selectedHobbies=[],uploadedPhotos=[];
const MAX_HOBBIES=5,MAX_PHOTOS=5;
const hobbiesData={"Creativity":["Painting","Singing"],"Sports":["Ping pong","Volleyball"],"Outdoor":["Hiking","Camping"],"At home":["Cooking","Reading"],"Movies and TV shows":["Comedy","Drama"],"Reading":["Fiction","Self-help"],"Music":["Pop","Rock"],"Food":["Baking","Coffee"],"Pets":["Dogs","Cats"],"Values and Personality":["Honesty","Kindness"]};
function togglePassword(id,el){const input=document.getElementById(id);if(input.type==="password"){input.type="text";el.innerText="🙈";}else{input.type="password";el.innerText="👁️";}}
function openTerms(e){e.preventDefault();document.getElementById('termsBody').innerText=KE_TERMS;document.getElementById('termsModal').style.display='flex';document.getElementById('acceptTermsBtn').disabled=true;}
function checkScroll(){const el=document.getElementById('termsBody');if(el.scrollTop+el.clientHeight>=el.scrollHeight-5){document.getElementById('acceptTermsBtn').disabled=false;}}
function acceptTerms(){document.getElementById('termsCheck').disabled=false;document.getElementById('termsCheck').checked=true;closeTerms();}
function closeTerms(){document.getElementById('termsModal').style.display='none';}
function switchAuth(type){document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.tab-auth').forEach(t=>t.classList.remove('active'));if(type==='signin'){document.getElementById('signinStep').classList.add('active');document.getElementById('tabSignIn').classList.add('active');}else{document.getElementById('step1').classList.add('active');document.getElementById('tabSignUp').classList.add('active');}}
function doSignIn(){const email=document.getElementById('loginEmail').value;const pass=document.getElementById('loginPassword').value;if(!email||!pass){alert('Enter email and password');return;}const savedProfile=JSON.parse(localStorage.getItem('patanisha_myProfile'));if(savedProfile&&savedProfile.email===email&&savedProfile.password===pass){alert('Welcome back '+savedProfile.name+'!');if(savedProfile.gender==='Male')window.location.href='../male.html';else window.location.href='../female.html';}else{alert('Invalid email or password.');}}
function askGenderConfirm(gender){tempGender=gender;document.getElementById('confirmText').innerText=`Are you sure you want to select ${gender}?`;document.getElementById('genderConfirm').style.display='flex';}
function closeConfirm(){document.getElementById('genderConfirm').style.display='none';}
function confirmGender(){selectedGender=tempGender;document.querySelectorAll('.gender-card').forEach(b=>b.classList.remove('selected'));if(tempGender==='Male')document.querySelectorAll('.gender-card')[0].classList.add('selected');if(tempGender==='Female')document.querySelectorAll('.gender-card')[1].classList.add('selected');closeConfirm();}
function goToStep2(){if(!document.getElementById('email').value.includes('@')||document.getElementById('password').value.length<6||!selectedGender||!document.getElementById('termsCheck').checked){alert('Please fill all fields and accept Terms');return;}userData.email=document.getElementById('email').value;userData.password=document.getElementById('password').value;userData.gender=selectedGender;document.getElementById('step1').classList.remove('active');document.getElementById('step2').classList.add('active');}
function goToStep3(){userData.name=document.getElementById('name').value;userData.dob=document.getElementById('dob').value;userData.city=document.getElementById('city').value;renderHobbies();document.getElementById('step2').classList.remove('active');document.getElementById('step3').classList.add('active');}
function renderHobbies(){let html='';Object.keys(hobbiesData).forEach(cat=>{html+=`<div class="hobby-category"><div class="category-title">${cat}</div><div class="hobby-tags">`;hobbiesData[cat].forEach(hobby=>{html+=`<div class="hobby-tag" onclick="toggleHobby(this,'${hobby}')">${hobby}</div>`;});html+=`</div></div>`;});document.getElementById('hobbiesList').innerHTML=html;}
function toggleHobby(el,hobby){if(el.classList.contains('selected')){el.classList.remove('selected');selectedHobbies=selectedHobbies.filter(h=>h!==hobby);}else{if(selectedHobbies.length>=MAX_HOBBIES)return;el.classList.add('selected');selectedHobbies.push(hobby);}document.getElementById('hobbyCounter').innerText=`${selectedHobbies.length}/${MAX_HOBBIES}`;}
function skipHobbies(){selectedHobbies=[];goToStep4();}
function goToStep4(){userData.hobbies=selectedHobbies;document.getElementById('step3').classList.remove('active');document.getElementById('step4').classList.add('active');}
function goBack(step){document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));document.getElementById(`step${step}`).classList.add('active');}
document.getElementById('avatar').onchange=function(e){let file=e.target.files[0];if(file){let reader=new FileReader();reader.onload=function(ev){document.getElementById('avatarPrev').src=ev.target.result;userData.avatar=ev.target.result;};reader.readAsDataURL(file);}}
document.getElementById('avatarPrev').onclick=()=>document.getElementById('avatar').click();
document.getElementById('photoInput').onchange=function(e){let file=e.target.files[0];if(file&&uploadedPhotos.length<MAX_PHOTOS){let reader=new FileReader();reader.onload=function(ev){uploadedPhotos.push(ev.target.result);renderPhotos();};reader.readAsDataURL(file);}}
function addPhoto(){if(uploadedPhotos.length>=MAX_PHOTOS)return;document.getElementById('photoInput').click();}
function renderPhotos(){let grid=document.getElementById('photoGrid');grid.innerHTML='';uploadedPhotos.forEach((src,idx)=>{grid.innerHTML+=`<div class="photo-box"><img src="${src}"><div class="photo-box remove" onclick="removePhoto(${idx})">×</div></div>`;});if(uploadedPhotos.length<MAX_PHOTOS)grid.innerHTML+=`<div class="photo-box" onclick="addPhoto()">+</div>`;}
function removePhoto(idx){uploadedPhotos.splice(idx,1);renderPhotos();}
function saveProfile(){
  userData.photos=uploadedPhotos;
  userData.id='PT'+Math.floor(Math.random()*900000+100000);
  localStorage.setItem('patanisha_myProfile', JSON.stringify(userData));
  alert('Account Created Successfully!');
  if(userData.gender==='Male')window.location.href='../male.html';
  else window.location.href='../female.html';
}
