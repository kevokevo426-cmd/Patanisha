<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patanisha - Sign In</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:linear-gradient(135deg,#00C8FF 0%,#00FFC8 50%,#FF00FF 100%);min-height:100vh;padding:0}
.top-bg{height:180px;position:relative;overflow:hidden}
.float-avatars{position:absolute;top:20px;width:100%;display:flex;justify-content:space-around}
.float-avatars img{width:60px;height:60px;border-radius:50%;border:3px solid #fff}
.container{background:#fff;border-radius:30px 30px 0 0;margin-top:-30px;padding:25px;min-height:calc(100vh - 150px)}
h1{font-size:22px;color:#333;margin-bottom:10px}
.subtitle{font-size:12px;color:#999;margin-bottom:20px}
.step{display:none}
.step.active{display:block}
.form-group{margin-bottom:16px}
label{display:block;margin-bottom:8px;font-weight:600;font-size:14px;color:#333}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:15px;background:#f8f8f8}
.gender-box{display:flex;gap:15px;justify-content:center}
.gender-card{flex:1;text-align:center;padding:20px 10px;border:2px solid #eee;border-radius:16px;cursor:pointer}
.gender-card.selected{border-color:#FF9800;background:#FFF3E0}
.peacock{width:70px;height:70px;margin:0 auto 10px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px}
.peacock.male{background:#D0E8FF}
.peacock.female{background:#FFD0E8}
.btn{width:100%;padding:16px;background:linear-gradient(135deg,#BA55D3,#9370DB);color:#fff;border:none;border-radius:15px;font-size:16px;font-weight:700;cursor:pointer;margin-top:15px}
.btn-outline{background:#fff;color:#9370DB;border:2px solid #9370DB}
.btn-yellow{background:#FFD600;color:#000}
.btn-row{display:flex;gap:10px}

/* HOBBIES STEP */
.hobbies-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.hobbies-counter{background:#000;color:#FFD600;padding:8px 16px;border-radius:20px;font-weight:700}
.hobbies-instruct{text-align:center;color:#FF5722;font-weight:600;margin-bottom:15px}
.hobby-category{margin-bottom:20px}
.category-title{font-weight:700;font-size:16px;margin-bottom:10px;color:#333}
.hobby-tags{display:flex;flex-wrap:wrap;gap:8px}
.hobby-tag{padding:8px 14px;border:1px solid #ddd;border-radius:20px;font-size:13px;cursor:pointer;background:#fff}
.hobby-tag.selected{background:#FF9800;color:#fff;border-color:#FF9800}
.hobby-tag.disabled{opacity:0.4;pointer-events:none}

/* VERIFICATION STEP */
.verify-instruct{text-align:center;color:#333;font-weight:600;margin-bottom:15px}
.avatar-preview{width:120px;height:120px;border-radius:50%;margin:0 auto 16px;display:block;border:4px solid #FFC107;object-fit:cover}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}
.photo-box{width:100%;aspect-ratio:1;border:2px dashed #ddd;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:30px;color:#ccc;cursor:pointer;position:relative;overflow:hidden}
.photo-box img{width:100%;height:100%;object-fit:cover}
.photo-box.remove{position:absolute;top:2px;right:4px;background:red;color:#fff;border-radius:50%;width:20px;height:20px;font-size:12px;display:flex;align-items:center;justify-content:center}

/* POPUP */
.confirm-popup{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:999;align-items:center;justify-content:center}
.confirm-box{background:#fff;border-radius:20px;padding:25px;text-align:center;width:85%}
.confirm-btns{display:flex;gap:10px;margin-top:15px}
.confirm-cancel{flex:1;padding:14px;background:#AEEA00;color:#333;border:none;border-radius:15px;font-weight:700}
.confirm-ok{flex:1;padding:14px;background:linear-gradient(135deg,#FF9800,#FF5722);color:#fff;border:none;border-radius:15px;font-weight:700}
.error{color:red;font-size:12px;margin-top:5px;display:none}
</style>
</head>
<body>

<div class="top-bg">
  <div class="float-avatars">
    <img src="https://i.pravatar.cc/60?img=1">
    <img src="https://i.pravatar.cc/60?img=2">
    <img src="https://i.pravatar.cc/60?img=3">
    <img src="https://i.pravatar.cc/60?img=4">
  </div>
</div>

<div class="container">
  <h1>Welcome to Patanisha</h1>

  <!-- STEP 1: EMAIL + PASSWORD + GENDER -->
  <div class="step active" id="step1">
    <h2>Create Account</h2>
    <p class="subtitle">Cannot be modified after submission</p>
    <div class="form-group"><label>Email</label><input type="email" id="email" placeholder="you@gmail.com"><div class="error" id="emailError"></div></div>
    <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="Min 6 characters"><div class="error" id="passError"></div></div>
    <div class="gender-box">
      <div class="gender-card" onclick="askGenderConfirm('Male')"><div class="peacock male">👑🦚</div><div>♂ Male</div></div>
      <div class="gender-card" onclick="askGenderConfirm('Female')"><div class="peacock female">🎀🦚</div><div>♀ Female</div></div>
    </div>
    <div class="error" id="genderError"></div>
    <div class="form-group"><label>Invitation Code <small>(Optional)</small></label><input type="text" id="inviteCode"></div>
    <button class="btn" onclick="goToStep2()">Next</button>
  </div>

  <!-- STEP 2: PROFILE -->
  <div class="step" id="step2">
    <h1>Introduce Yourself</h1>
    <div class="form-group"><label>Full Name</label><input type="text" id="name" placeholder="Hannah"></div>
    <div class="form-group"><label>Date of Birth</label><input type="date" id="dob"></div>
    <div class="form-group"><label>City</label><input type="text" id="city" placeholder="Ruiru, Nairobi"></div>
    <div class="form-group"><label>Bio</label><textarea id="bio" rows="2" style="width:100%;padding:14px;border:1px solid #ddd;border-radius:12px"></textarea></div>
    <div class="btn-row"><button class="btn btn-outline" onclick="goBack(1)">← Back</button><button class="btn" onclick="goToStep3()">Next</button></div>
  </div>

  <!-- STEP 3: HOBBIES - PICK ONLY 3 -->
  <div class="step" id="step3">
    <div class="hobbies-header"><h1>Choose Hobbies</h1><div class="hobbies-counter" id="hobbyCounter">0/3</div></div>
    <p class="hobbies-instruct">Please pick exactly 3 hobbies</p>
    <div id="hobbiesList"></div>
    <div class="btn-row"><button class="btn btn-yellow" onclick="goToStep4()">Skip</button><button class="btn" onclick="goToStep4()">Next</button></div>
  </div>

  <!-- STEP 4: VERIFICATION - AVATAR + PHOTOS -->
  <div class="step" id="step4">
    <h1>Verification</h1>
    <p class="verify-instruct">Choose Avatar + Upload up to 5 photos</p>
    
    <div class="form-group">
      <label>Profile Avatar</label>
      <img id="avatarPrev" src="https://via.placeholder.com/120/ff9800/fff?text=Tap" class="avatar-preview">
      <input type="file" id="avatar" accept="image/*" style="display:none">
    </div>

    <div class="form-group">
      <label>Upload Photos <small id="photoCount">0/5</small></label>
      <div class="photo-grid" id="photoGrid">
        <div class="photo-box" onclick="addPhoto()">+</div>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-outline" onclick="goBack(3)">← Back</button>
      <button class="btn" id="finishBtn" onclick="saveProfile()">Finish & Join</button>
    </div>
  </div>
</div>

<!-- GENDER CONFIRM POPUP -->
<div class="confirm-popup" id="genderConfirm">
  <div class="confirm-box">
    <p id="confirmText">Are you sure you want to select Female?</p>
    <div class="confirm-btns">
      <button class="confirm-cancel" onclick="closeConfirm()">Cancel</button>
      <button class="confirm-ok" onclick="confirmGender()">Confirm</button>
    </div>
  </div>
</div>

<input type="file" id="photoInput" accept="image/*" style="display:none">

<script>
let userData = {};
let selectedGender = '';
let tempGender = '';
let selectedHobbies = [];
let uploadedPhotos = [];
const MAX_HOBBIES = 3;
const MAX_PHOTOS = 5;

const hobbiesData = {
  "Creativity": ["Painting","Drawing","Crafts","Design","Photography"],
  "Sports": ["Ping pong","Volleyball","Swimming","Gymnastics","Basketball","Yoga"],
  "Outdoor": ["Hiking","Camping","Fishing","Cycling","Climbing"],
  "At home": ["Cooking","Gardening","Reading","Board games","Puzzles"],
  "Movies and TV": ["Action","Comedy","Drama","Horror","Sci-fi"],
  "Music": ["Pop","Rock","Jazz","Classical","Hip hop"],
  "Food": ["Coffee","Tea","Pizza","Sushi","Dessert"]
};

function askGenderConfirm(gender){tempGender = gender;document.getElementById('confirmText').innerText = `Are you sure you want to select ${gender}?`;document.getElementById('genderConfirm').style.display = 'flex';}
function closeConfirm(){document.getElementById('genderConfirm').style.display = 'none';}
function confirmGender(){selectedGender = tempGender;document.querySelectorAll('.gender-card').forEach(b=>b.classList.remove('selected'));document.querySelectorAll('.gender-card')[tempGender==='Male'?0:1].classList.add('selected');closeConfirm();}

function goToStep2(){
  const email = document.getElementById('email').value;
  const pass = document.getElementById('password').value;
  if(!email.includes('@') || pass.length < 6 ||!selectedGender) return alert('Fill all fields correctly');
  userData.email = email; userData.password = pass; userData.gender = selectedGender; userData.inviteCode = document.getElementById('inviteCode').value;
  document.getElementById('step1').classList.remove('active'); document.getElementById('step2').classList.add('active');
}

function goToStep3(){
  userData.name = document.getElementById('name').value; userData.dob = document.getElementById('dob').value; userData.city = document.getElementById('city').value; userData.bio = document.getElementById('bio').value;
  renderHobbies(); document.getElementById('step2').classList.remove('active'); document.getElementById('step3').classList.add('active');
}

function goToStep4(){
  document.getElementById('step3').classList.remove('active'); document.getElementById('step4').classList.add('active');
}

function goBack(step){document.querySelectorAll('.step').forEach(s=>s.classList.remove('active'));document.getElementById('step'+step).classList.add('active');}

function renderHobbies(){let html = '';for(let cat in hobbiesData){html += `<div class="hobby-category"><div class="category-title">${cat}</div><div class="hobby-tags">`;hobbiesData[cat].forEach(h=>{html += `<div class="hobby-tag" onclick="toggleHobby(this,'${h}')">${h}</div>`;});html += `</div></div>`;}document.getElementById('hobbiesList').innerHTML = html;}

function toggleHobby(el, hobby){
  if(el.classList.contains('selected')){el.classList.remove('selected');selectedHobbies = selectedHobbies.filter(h=>h!==hobby);}
  else {if(selectedHobbies.length >= MAX_HOBBIES) return;el.classList.add('selected');selectedHobbies.push(hobby);}
  document.getElementById('hobbyCounter').innerText = `${selectedHobbies.length}/${MAX_HOBBIES}`;
  document.querySelectorAll('.hobby-tag').forEach(tag=>{if(selectedHobbies.length >= MAX_HOBBIES &&!tag.classList.contains('selected')){tag.classList.add('disabled');}else{tag.classList.remove('disabled');}});
}

// VERIFICATION FUNCTIONS
document.getElementById('avatar').onchange = async e => {const file = e.target.files[0];if(file) document.getElementById('avatarPrev').src = await compressImage(file);};
document.getElementById('avatarPrev').onclick = () => document.getElementById('avatar').click();

document.getElementById('photoInput').onchange = async e => {
  const file = e.target.files[0];
  if(file && uploadedPhotos.length < MAX_PHOTOS){
    uploadedPhotos.push(await compressImage(file));
    renderPhotos();
  }
};

function addPhoto(){if(uploadedPhotos.length < MAX_PHOTOS) document.getElementById('photoInput').click();}
function removePhoto(index){uploadedPhotos.splice(index,1);renderPhotos();}

function renderPhotos(){
  let html = '';
  uploadedPhotos.forEach((src,i)=>{html += `<div class="photo-box"><img src="${src}"><div class="remove" onclick="removePhoto(${i})">×</div></div>`});
  for(let i=uploadedPhotos.length; i<MAX_PHOTOS; i++){html += `<div class="photo-box" onclick="addPhoto()">+</div>`}
  document.getElementById('photoGrid').innerHTML = html;
  document.getElementById('photoCount').innerText = `${uploadedPhotos.length}/${MAX_PHOTOS}`;
}

function compressImage(file){
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let {width, height} = img;
        const maxW = 500;
        if(width > maxW){ height *= maxW/width; width = maxW; }
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      }
      img.src = e.target.result;
    }
    reader.readAsDataURL(file);
  });
}

async function saveProfile(){
  const btn = document.getElementById('finishBtn'); btn.disabled = true; btn.innerText = 'Saving...';
  
  let avatar = document.getElementById('avatarPrev').src;
  const avatarFile = document.getElementById('avatar').files[0];
  if(avatarFile) avatar = await compressImage(avatarFile);

  const profile = {
    id: Date.now(),
 ...userData,
    age: new Date().getFullYear() - new Date(userData.dob).getFullYear(),
    hobbies: selectedHobbies,
    avatar: avatar,
    photos: uploadedPhotos, // UP TO 5 PHOTOS
    level: 1, distance: '1km', friends: 0
  };
  localStorage.setItem('patanisha_myProfile', JSON.stringify(profile));
  let users = JSON.parse(localStorage.getItem('patanishaUsers')) || [];
  if(!users.find(u=>u.email===profile.email)){users.push(profile);localStorage.setItem('patanishaUsers', JSON.stringify(users));}
  alert('Account Created & Verified!');
  window.location.href = '../index.html';
}
</script>
</body>
</html>
