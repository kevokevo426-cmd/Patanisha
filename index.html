<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patanisha</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <div id="root"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAXwKw7n28LiJx2W4PBkQG7_glL0sVog8M",
      authDomain: "patanisha-49561.firebaseapp.com",
      projectId: "patanisha-49561",
      storageBucket: "patanisha-49561.firebasestorage.app",
      messagingSenderId: "363879415134",
      appId: "1:363879415134:web:81b99ab93290a3e45723cf",
      measurementId: "G-GLXLGVWLHF"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const root = document.getElementById('root');
    let currentPage = 'home';

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const snap = await getDoc(doc(db, "users", user.uid));
        const userData = snap.data();
        if(userData.gender === "male" &&!userData.isPremium){
          showPaywall(user);
        } else {
          showHome(user);
        }
      } else {
        showLogin();
      }
    });

    function showLogin(){
      root.innerHTML = `
      <div class="text-white text-center p-8 max-w-md mx-auto min-h-screen flex flex-col justify-center bg-black">
        <h1 class="text-pink-500 text-4xl font-bold">Patanisha ❤️</h1>
        <input id="email" placeholder="Email" class="w-full p-3 mt-6 bg-gray-800 rounded">
        <input id="pass" type="password" placeholder="Password" class="w-full p-3 mt-3 bg-gray-800 rounded">
        <select id="gender" class="w-full p-3 mt-3 bg-gray-800 rounded">
          <option value="">Select Gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
        <button onclick="signup()" class="bg-pink-500 w-full py-3 rounded mt-4 font-bold">Sign Up</button>
        <button onclick="login()" class="bg-gray-600 w-full py-3 rounded mt-2">Login</button>
      </div>`;
    }

    window.signup = async () => {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('pass').value;
      const gender = document.getElementById('gender').value;
      if(!gender) return alert("Chagua gender kwanza");
      try {
        const userCred = await createUserWithEmailAndPassword(auth, email, pass);
        await setDoc(doc(db, "users", userCred.user.uid), {email, gender, isPremium: gender === "female"});
      } catch(e){ alert(e.message); }
    }

    window.login = async () => {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('pass').value;
      try { await signInWithEmailAndPassword(auth, email, pass); }
      catch(e){ alert(e.message); }
    }

    window.logout = async () => {
      await signOut(auth);
    }

    function showPaywall(user){
      root.innerHTML = `
      <div class="bg-black text-white text-center p-8 min-h-screen flex-col justify-center">
        <h1 class="text-4xl font-bold text-pink-500">Unlock Premium</h1>
        <p class="mt-4 text-lg">Men pay 500 KES to chat & see profiles</p>
        <button onclick="alert('M-Pesa coming soon')" class="bg-gradient-to-r from-pink-500 to-red-500 px-8 py-3 rounded-full mt-6 font-bold">Pay with M-Pesa</button>
        <button onclick="logout()" class="bg-gray-600 px-8 py-3 rounded-full mt-3">Logout</button>
      </div>`;
    }

    function showHome(user){
      currentPage = 'home';
      root.innerHTML = `
      <div class="bg-white min-h-screen pb-20 font-sans">
        <!-- YELLOW BANNER -->
        <div class="bg-gradient-to-r from-yellow-300 to-yellow-200 rounded-2xl mx-3 mt-3 p-4 flex items-center shadow-md">
          <div class="flex-1">
            <h2 class="font-bold text-black text-base">Set up 3 Say hi texts</h2>
            <p class="text-sm text-gray-800 mt-1">The other user is more likely to reply to you</p>
          </div>
          <img src="https://cdn-icons-png.flaticon.com/512/8913/8913995.png" class="w-20 h-20" />
          <button class="bg-gradient-to-r from-orange-400 to-red-500 text-white px-6 py-2 rounded-full font-bold ml-2 shadow">Go</button>
        </div>

        <!-- TABS -->
        <div class="flex items-center gap-5 px-4 mt-4 overflow-x-auto text-sm">
          <button class="font-bold text-xl text-black border-b-4 border-yellow-400 pb-1">Recommend</button>
          <button class="text-gray-500">Newcomer</button>
          <button class="text-gray-500">Nearby</button>
          <button>🏆</button>
          <button class="ml-auto text-2xl">🔍</button>
        </div>

        <!-- USER CARDS -->
        <div class="px-3 mt-4 space-y-5">
          ${getUserCard("Thaguru 77", "https://i.pravatar.cc/150?img=1", "VIP0", 48, "<0.1km")}
          ${getUserCard("David Mbai", "https://i.pravatar.cc/150?img=2", "VIP2", 20, "<0.1km")}
          ${getUserCard("joram fuchingo", "https://i.pravatar.cc/150?img=3", "VIP1", 37, "<0.1km", "Sometimes")}
          ${getUserCard("EmberSage", "https://i.pravatar.cc/150?img=4", "VIP1", 20, "<0.1km")}
        </div>
        ${bottomNav()}
      </div>
      `;
    }

    function showChat(user){
      currentPage = 'chat';
      root.innerHTML = `
      <div class="bg-white min-h-screen pb-20">
        <!-- TOP BAR -->
        <div class="sticky top-0 bg-white z-10">
          <div class="flex items-center px-4 pt-3 pb-2">
            <button class="font-bold text-2xl text-black relative">Chat
              <div class="absolute -bottom-1 left-0 w-3 h-3 bg-yellow-400 rounded-full"></div>
            </button>
            <button class="ml-6 text-xl text-gray-400">Call</button>
            <button class="ml-auto bg-yellow-300 rounded-full px-3 py-1 flex items-center">😁 ></button>
            <button class="ml-3">🎁</button>
            <button class="ml-3">👤</button>
            <button class="ml-3">📊</button>
          </div>
          <div class="h-1 bg-yellow-300 mx-4 rounded-full"></div>
        </div>

        <!-- CHAT LIST -->
        <div class="px-3 mt-2">
          ${chatItem("2,201 have seen me", "Hey! People here appreciate you, see whos visiting your profile", "https://cdn-icons-png.flaticon.com/512/1828/1828640.png", "+802", "purple")}
          ${chatItem("Official Team", "This time you haven't reached the goal of 13,000 diamonds, t...", "https://cdn-icons-png.flaticon.com/512/1034/1034144.png", "", "pink")}
          ${chatItem("Exclusive cus...", "Please ask your agency", "https://i.pravatar.cc/150?img=10", "02-25 19:21", "gold", "Exclusive")}
          ${chatItem("Customer se...", "chat first with the men b...", "https://cdn-icons-png.flaticon.com/512/1034/1034144.png", "12-22 23:08", "pink", "Official")}
          ${chatItem("Mus'ab Barre", "Didn't reply to the other p...", "https://i.pravatar.cc/150?img=11", "08-16 05:35")}
          ${chatItem("Mutuku", "Didn't reply to the other p...", "https://i.pravatar.cc/150?img=12", "08-16 05:35", "", "", "1")}
          ${chatItem("Phoenix2024", "", "https://i.pravatar.cc/150?img=13", "08-16 05:34", "", "NEW")}
        </div>

        <!-- FLOATING GAME BUTTON -->
        <button class="fixed right-3 top-24 bg-blue-500 rounded-full w-16 h-16 flex flex-col items-center justify-center shadow-lg">
          <div class="text-2xl">🎮</div>
          <div class="bg-yellow-400 text-black text-[10px] font-bold px-2 rounded-full -mt-1">Game</div>
        </button>
        ${bottomNav()}
      </div>
      `;
    }

    function chatItem(title, subtitle, img, time, color="", badge="", notif=""){
      return `
      <div class="flex items-center py-3 border-b border-gray-100">
        <div class="relative">
          <img src="${img}" class="w-14 h-14 rounded-full ${color==="gold"? "border-4 border-yellow-400" : ""}" />
          ${color==="purple"? `<div class="absolute inset-0 bg-gradient-to-r from-purple-500 to-pink-500 rounded-full flex items-center justify-center text-white font-bold">Hi</div>` : ""}
          ${color==="pink"? `<div class="absolute inset-0 bg-pink-500 rounded-full flex items-center justify-center"><svg class="w-7 h-7 text-white" fill="currentColor" viewBox="0 0 20 20"><path d="M2 3a1 1 0 011-1h2.153a1 1 0 01.986.836l.74 4.435a1 1 0 01-.54 1.06l-1.548.773a11.037 11.037 0 006.105 6.105l.774-1.548a1 1 0 011.059-.54l4.435.74a1 1 0 01.836.986V17a1 1 0 01-1 1h-2C7.82 18 2 12.18 2 5V3z"></path></svg></div>` : ""}
        </div>
        <div class="ml-3 flex-1">
          <div class="flex items-center">
            <h3 class="font-bold text-black ${title.includes('Customer')? 'text-yellow-500' : ''}">${title}</h3>
            ${badge? `<span class="ml-2 bg-${badge==="Exclusive"? "brown-600" : "blue-500"} text-white text-[10px] px-2 py-0.5 rounded-full">${badge}</span>` : ""}
            <span class="ml-auto text-sm text-gray-400">${time}</span>
          </div>
          <p class="text-sm text-gray-500 mt-1 truncate">${subtitle}</p>
        </div>
        ${notif? `<div class="ml-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">${notif}</div>` : ""}
        ${time.includes(":") &&!notif? `<button class="ml-2 text-purple-400">📌</button>` : ""}
      </div>
      `
    }

    function getUserCard(name, img, vip, age, distance, status=""){
      const vipColor = vip==="VIP2"? "green" : "blue";
      return `
      <div class="flex items-center bg-white px-1">
        <div class="relative">
          <img src="${img}" class="w-20 h-20 rounded-full border-4 ${vip!=="VIP0"? `border-${vipColor}-500` : "border-gray-200"}" />
          ${vip!=="VIP0"? `<div class="absolute -bottom-1 left-1/2 -translate-x-1/2 bg-${vipColor}-600 text-white text-[10px] px-2 rounded-full font-bold">⭐${vip}</div>` : ""}
          <div class="absolute bottom-1 right-1 w-3 h-3 bg-green-500 rounded-full border-2 border-white"></div>
        </div>
        <div class="ml-3 flex-1">
          <h3 class="font-bold text-black">${name}</h3>
          <div class="flex gap-1 mt-1 flex-wrap">
            ${vip!=="VIP0"? `<span class="bg-${vipColor}-100 text-${vipColor}-700 text-xs px-2 py-0.5 rounded-full">⭐${vip}</span>` : ""}
            <span class="bg-green-100 text-green-700 text-xs px-2 py-0.5 rounded-full">📍${distance}</span>
            <span class="bg-blue-100 text-blue-700 text-xs px-2 py-0.5 rounded-full">♂ ${age}</span>
          </div>
        </div>
        <button onclick="alert('Say Hi to ${name}')" class="bg-gradient-to-r from-yellow-400 to-orange-400 text-white font-bold px-4 py-2 rounded-full">💬 Hi</button>
      </div>
      `
    }

    function bottomNav(){
      return `
      <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-2">
        <button onclick="showHome(auth.currentUser)" class="flex flex-col items-center ${currentPage==='home'?'text-black':'text-gray-400'}">
          <svg width="24" height="24" fill="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
          <span class="text-xs mt-1">Home</span>
        </button>
        <button class="flex flex-col items-center text-gray-400">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          <span class="text-xs mt-1">Moment</span>
        </button>
        <button onclick="showChat(auth.currentUser)" class="flex flex-col items-center relative ${currentPage==='chat'?'text-black':'text-gray-400'}">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          <span class="absolute -top-1 right-2 bg-red-500 text-white text-[10px] rounded-full w-5 h-5 flex items-center justify-center">32</span>
          <span class="text-xs mt-1">Chat</span>
        </button>
        <button class="flex flex-col items-center text-gray-400">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <span class="text-xs mt-1">Me</span>
        </button>
      </div>
      `
    }
  </script>
</body>
</html>
