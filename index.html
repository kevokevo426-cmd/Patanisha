<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PATANISHA - Anonymous Confessions</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    h1 {
      text-align: center;
      color: #764ba2;
      margin-bottom: 10px;
      font-size: 2.5em;
    }
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #555;
    }
    textarea {
      width: 100%;
      padding: 15px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      resize: vertical;
      min-height: 150px;
      font-family: inherit;
    }
    textarea:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
    .confessions {
      margin-top: 40px;
    }
    .confession-card {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 15px;
      border-left: 4px solid #667eea;
    }
    .confession-date {
      font-size: 12px;
      color: #999;
      margin-top: 10px;
    }
    .anonymous {
      color: #764ba2;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔥 PATANISHA</h1>
    <p class="subtitle">Share anonymously. Be heard.</p>

    <div class="form-group">
      <label for="confession">Your Confession</label>
      <textarea id="confession" placeholder="Write what’s on your mind... No one will know it's you."></textarea>
    </div>
    <button onclick="postConfession()">Post Anonymously</button>

    <div class="confessions">
      <h2>Recent Confessions</h2>
      <div id="confessionList">
        <div class="confession-card">
          <p>I'm tired of pretending I'm okay when I'm not.</p>
          <div class="confession-date">Posted by <span class="anonymous">Anonymous</span> • Just now</div>
        </div>
        <div class="confession-card">
          <p>I failed my exams but I'm too scared to tell my parents.</p>
          <div class="confession-date">Posted by <span class="anonymous">Anonymous</span> • 2 hours ago</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function postConfession() {
      const text = document.getElementById('confession').value;
      if(text.trim() === '') {
        alert('Please write something first!');
        return;
      }
      
      const list = document.getElementById('confessionList');
      const newConfession = document.createElement('div');
      newConfession.className = 'confession-card';
      newConfession.innerHTML = `
        <p>${text}</p>
        <div class="confession-date">Posted by <span class="anonymous">Anonymous</span> • Just now</div>
      `;
      list.prepend(newConfession);
      document.getElementById('confession').value = '';
      alert('Posted! Your confession is live 🔥');
    }
  </script>
</body>
</html>
