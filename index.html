<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patanisha - Meet & Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    .active-icon { color: #FF8C00; }
  </style>
</head>
<body class="bg-gray-100 pb-20">
  
  <!-- Header -->
  <div class="bg-gradient-to-r from-yellow-400 to-orange-500 p-4 text-white">
    <h1 class="text-2xl font-bold">🔥 Patanisha</h1>
    <p class="text-sm">Find friends near you</p>
  </div>

  <!-- User Cards -->
  <div class="p-4">
    <h2 class="font-bold text-lg mb-3">People Near You</h2>
    <div id="userList" class="space-y-3">
      <!-- Users load here from Firebase -->
    </div>
  </div>

  <!-- Bottom Navigation - ALL ICONS NOW CLICKABLE -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t shadow-lg flex justify-around py-3">
    
    <a href="index.html" class="text-center active-icon">
      <div class="text-2xl">🏠</div>
      <p class="text-xs font-semibold">Home</p>
    </a>

    <a href="friends.html" class="text-center text-gray-400">
      <div class="text-2xl">👥</div>
      <p class="text-xs">Friends</p>
    </a>

    <a href="vip.html" class="text-center text-gray-400">
      <div class="text-2xl">👑</div>
      <p class="text-xs">VIP</p>
    </a>

    <a href="chat.html" class="text-center text-gray-400">
      <div class="text-2xl">💬</div>
      <p class="text-xs">Chat</p>
    </a>

    <a href="profile.html" class="text-center text-gray-400">
      <div class="text-2xl">👤</div>
      <p class="text-xs">Profile</p>
    </a>

  </div>

<script>
  // PASTE YOUR FIREBASE CONFIG HERE
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    projectId: "YOUR_PROJECT_ID"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // Load users
  db.collection("users").limit(10).onSnapshot(snapshot => {
    let html = '';
    snapshot.forEach(doc => {
      const u = doc.data();
      let vip = u.friends >= 50 ? 'VIP5' : u.friends >= 10 ? 'VIP1' : '';
      html += `
      <div class="bg-white p-3 rounded-lg shadow flex justify-between items-center">
        <div>
          <p class="font-bold">${u.name} ${vip ? `<span class="text-purple-500 text-xs">${vip}</span>` : ''}</p>
          <p class="text-sm text-gray-500">${u.city} • ${u.friends} friends</p>
        </div>
        <button class="bg-orange-500 text-white px-3 py-1 rounded">Add</button>
      </div>
      `
    });
    document.getElementById('userList').innerHTML = html;
  });
</script>
</body>
</html>
