<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patanisha</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <div id="root">Loading Patanisha...</div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAXwKw7n28LiJx2W4PBkQG7_glL0sVog8M",
      authDomain: "patanisha-49561.firebaseapp.com",
      projectId: "patanisha-49561",
      storageBucket: "patanisha-49561.firebasestorage.app",
      messagingSenderId: "363879415134",
      appId: "1:363879415134:web:81b99ab93290a3e45723cf"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const root = document.getElementById('root');

    auth.onAuthStateChanged((user) => {
      if (user) {
        showMe(user);
      } else {
        showLogin();
      }
    });

    function showLogin(){
      root.innerHTML = `<div class="text-white text-center p-8 max-w-md mx-auto min-h-screen flex flex-col justify-center bg-black">
        <h1 class="text-pink-500 text-4xl font-bold">Patanisha ❤️</h1>
        <input id="email" placeholder="Email" class="w-full p-3 mt-6 bg-gray-800 rounded text-white">
        <input id="pass" type="password" placeholder="Password" class="w-full p-3 mt-3 bg-gray-800 rounded text-white">
        <button onclick="signup()" class="bg-pink-500 w-full py-3 rounded mt-4 font-bold">Sign Up</button>
        <button onclick="login()" class="bg-gray-600 w-full py-3 rounded mt-2">Login</button>
      </div>`;
    }
    function signup(){ const email = document.getElementById('email').value; const pass = document.getElementById('pass').value; auth.createUserWithEmailAndPassword(email, pass).catch(e => alert(e.message)); }
    function login(){ const email = document.getElementById('email').value; const pass = document.getElementById('pass').value; auth.signInWithEmailAndPassword(email, pass).catch(e => alert(e.message)); }
    function logout(){ auth.signOut(); }

    async function showMe(user){
      const docRef = db.collection("users").doc(user.uid);
      let snap = await docRef.get();
      if(!snap.exists){
        await docRef.set({
          username: "User" + Math.floor(Math.random()*9999),
          userId: "PT" + Math.floor(Math.random()*900000 + 100000),
          photo: `https://i.pravatar.cc/150?u=${user.uid}`,
          coins: 6, diamonds: 10, friends: 0, following: 0, followers: 0, visitors: 0
        });
        snap = await docRef.get();
      }
      const data = snap.data();
      root.innerHTML = `
      <div class="min-h-screen pb-20">
        <div class="bg-gradient-to-b from-yellow-100 to-white p-4">
          <div class="flex items-center">
            <img src="${data.photo}" class="w-16 h-16 rounded-full border-2 border-white"/>
            <div class="ml-3"><h1 class="font-bold text-lg">${data.username} 😊</h1><p class="text-sm text-gray-600">ID:${data.userId}</p></div>
          </div>
          <div class="flex justify-around text-center mt-4">
            <div><p class="font-bold">${data.friends}</p><p class="text-xs">Friends</p></div>
            <div><p class="font-bold">${data.following}</p><p class="text-xs">Following</p></div>
            <div><p class="font-bold">${data.followers}</p><p class="text-xs">Followers</p></div>
            <div><p class="font-bold">${data.visitors}</p><p class="text-xs">Visitors</p></div>
          </div>
        </div>
        <button onclick="logout()" class="m-4 w-[calc(100%-32px)] bg-red-500 text-white p-3 rounded-xl font-bold">Logout</button>
      </div>`;
    }
  </script>
</body>
</html>
