<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patanisha v2.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#f5f5f5}
.header{background:#FF1493;color:white;padding:15px;text-align:center}
.header h1{font-size:24px}
.nav{display:flex;background:white;position:fixed;bottom:0;width:100%;box-shadow:0 -2px 5px rgba(0,0,0,0.1)}
.nav button{flex:1;padding:12px;border:none;background:none;font-size:12px;color:#888}
.nav button.active{color:#FF1493}
.page{display:none;padding:20px;padding-bottom:80px}
.page.active{display:block}
.input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px}
.btn{width:100%;padding:12px;background:#FF1493;color:white;border:none;border-radius:8px;font-weight:bold;margin:8px 0}
.chat-box{height:400px;overflow-y:auto;background:white;border-radius:10px;padding:10px;margin-bottom:10px}
.msg{background:#FF1493;color:white;padding:8px 12px;border-radius:15px;margin:5px 0;max-width:70%}
</style>
</head>
<body>

<div class="header">
  <h1>Patanisha</h1>
</div>

<div id="loginPage" class="page active">
  <h2>Welcome BOSS</h2>
  <input type="text" id="username" class="input" placeholder="Enter Username">
  <input type="password" id="password" class="input" placeholder="Enter Password">
  <button class="btn" onclick="login()">Login / Register</button>
</div>

<div id="homePage" class="page">
  <h2>Welcome <span id="userDisplay"></span>!</h2>
  <p>Your ID: <b id="userID"></b></p>
  <p>Start connecting with people.</p>
</div>

<div id="chatPage" class="page">
  <h2>Chat</h2>
  <div class="chat-box" id="chatBox"></div>
  <input type="text" id="msgInput" class="input" placeholder="Type message...">
  <button class="btn" onclick="sendMsg()">Send</button>
</div>

<div id="mePage" class="page">
  <h2>Profile</h2>
  <p><b>Name:</b> <span id="meName"></span></p>
  <p><b>ID:</b> <span id="meID"></span></p>
  <button class="btn" onclick="logout()" style="background:red">Logout</button>
</div>

<div class="nav">
  <button class="navBtn active" onclick="showPage('homePage')">🏠 Home</button>
  <button class="navBtn" onclick="showPage('chatPage')">💬 Chat</button>
  <button class="navBtn" onclick="showPage('mePage')">👤 Me</button>
</div>

<script>
let currentUser = localStorage.getItem('patanisha_user');

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.navBtn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  
  if(currentUser){
    document.getElementById('userDisplay').innerText = currentUser;
    document.getElementById('userID').innerText = 'ID_' + currentUser;
    document.getElementById('meName').innerText = currentUser;
    document.getElementById('meID').innerText = 'ID_' + currentUser;
  }
}

function login(){
  let user = document.getElementById('username').value;
  if(user.length < 3){ alert('Username too short'); return; }
  localStorage.setItem('patanisha_user', user);
  currentUser = user;
  showPage('homePage');
}

function logout(){
  localStorage.removeItem('patanisha_user');
  location.reload();
}

function sendMsg(){
  let msg = document.getElementById('msgInput').value;
  if(msg=='')return;
  document.getElementById('chatBox').innerHTML += `<div class="msg">${msg}</div>`;
  document.getElementById('msgInput').value='';
}

if(currentUser){ showPage('homePage'); }
</script>

</body>
</html>
