<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patanisha</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100">
  <div id="root">Loading...</div>
  <input type="file" id="photoInput" accept="image/*" style="display:none">

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAXwKw7n28LiJx2W4PBkQG7_glL0sVog8M",
      authDomain: "patanisha-49561.firebaseapp.com",
      projectId: "patanisha-49561",
      storageBucket: "patanisha-49561.firebasestorage.app",
      messagingSenderId: "363879415134",
      appId: "1:363879415134:web:81b99ab93290a3e45723cf"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const root = document.getElementById('root');
    let currentPage = 'home';
    let currentUser = null;
    let currentUserData = {coins: 6, friends: 0, following: 6, followers: 128, visitors: 2201};
    let allUsers = [];
    let chats = [];

    auth.onAuthStateChanged(async (user) => {
      if (user) {
        currentUser = user;
        await ensureUserData(user.uid);
        if(currentUserData.gender === "male" &&!currentUserData.isPremium){
          showPaywall();
        } else {
          loadUsers();
          loadChats();
          showHome();
        }
      } else {
        showLogin();
      }
    });

    async function ensureUserData(uid){
      const docRef = db.collection("users").doc(uid);
      const snap = await docRef.get();
      currentUserData = snap.data() || {};
      let updates = {};
      if(!currentUserData.username) updates.username = "User" + Math.floor(Math.random()*9999);
      if(!currentUserData.userId) updates.userId = "PT" + Math.floor(Math.random()*900000 + 100000);
      if(!currentUserData.photo) updates.photo = `https://i.pravatar.cc/150?u=${uid}`;
      if(Object.keys(updates).length > 0){
        await docRef.update(updates);
        currentUserData = {...currentUserData,...updates};
      }
    }

    async function loadUsers(){
      const snapshot = await db.collection("users").get();
      allUsers = [];
      snapshot.forEach(doc => { if(doc.id!== currentUser.uid){ allUsers.push({id: doc.id,...doc.data()}); } });
    }

    function loadChats(){
      db.collection("chats").where("members", "array-contains", currentUser.uid).orderBy("lastMessageTime", "desc").onSnapshot(snapshot => {
        chats = [];
        snapshot.forEach(doc => { chats.push({id: doc.id,...doc.data()}); });
        if(currentPage === 'chat') showChat();
      });
    }

    function showLogin(){
      root.innerHTML = `<div class="text-white text-center p-8 max-w-md mx-auto min-h-screen flex-col justify-center bg-black"><h1 class="text-pink-500 text-4xl font-bold">Patanisha ❤️</h1><input id="email" placeholder="Email" class="w-full p-3 mt-6 bg-gray-800 rounded text-white"><input id="pass" type="password" placeholder="Password" class="w-full p-3 mt-3 bg-gray-800 rounded text-white"><select id="gender" class="w-full p-3 mt-3 bg-gray-800 rounded text-white"><option value="">Select Gender</option><option value="male">Male</option><option value="female">Female</option></select><button onclick="signup()" class="bg-pink-500 w-full py-3 rounded mt-4 font-bold">Sign Up</button><button onclick="login()" class="bg-gray-600 w-full py-3 rounded mt-2">Login</button></div>`;
    }
    function signup(){
      const email = document.getElementById('email').value;
      const pass = document.getElementById('pass').value;
      const gender = document.getElementById('gender').value;
      if(!gender) return alert("Chagua gender kwanza");
      const username = "User" + Math.floor(Math.random()*9999);
      const userId = "PT" + Math.floor(Math.random()*900000 + 100000);
      auth.createUserWithEmailAndPassword(email, pass).then(userCred => {
        db.collection("users").doc(userCred.user.uid).set({
          email, gender, username, userId,
          photo: `https://i.pravatar.cc/150?u=${userCred.user.uid}`,
          age: Math.floor(Math.random()*15)+20,
          isPremium: gender === "female", coins: 6
        });
      }).catch(e => alert(e.message));
    }
    function login(){ const email = document.getElementById('email').value; const pass = document.getElementById('pass').value; auth.signInWithEmailAndPassword(email, pass).catch(e => alert(e.message)); }
    function logout(){ auth.signOut(); }
    function showPaywall(){ root.innerHTML = `<div class="bg-black text-white text-center p-8 min-h-screen flex-col justify-center"><h1 class="text-4xl font-bold text-pink-500">Unlock Premium</h1><button onclick="logout()" class="bg-gray-600 px-8 py-3 rounded-full mt-3">Logout</button></div>`; }
    function showHome(){ currentPage = 'home'; const men = allUsers.filter(u => u.gender === "male"); root.innerHTML = `<div class="bg-white min-h-screen pb-20"><div class="px-3 mt-4 space-y-4">${men.map(user => `<div class="flex items-center bg-white p-3 rounded-xl shadow-sm"><img src="${user.photo}" class="w-16 h-16 rounded-full"/><div class="ml-3 flex-1"><p class="font-bold">${user.username}</p><p class="text-sm text-gray-500">ID: ${user.userId}</p></div><button onclick="alert('Chat with ${user.username}')" class="bg-orange-400 text-white px-4 py-2 rounded-full">Hi</button></div>`).join('')}</div>${nav()}</div>`; }

    // NEW ME PAGE - LIKE YOUR SCREENSHOT
    function showMe(){
      currentPage = 'me';
      root.innerHTML = `
      <div class="min-h-screen pb-20">
        <!-- HEADER WITH GRADIENT -->
        <div class="bg-gradient-to-b from-yellow-100 to-white p-4">
          <div class="flex items-center">
            <div class="relative">
              <img id="profilePic" src="${currentUserData.photo}" onclick="document.getElementById('photoInput').click()" class="w-16 h-16 rounded-full border-2 border-white"/>
              <span class="absolute bottom-0 right-0 bg-green-500 text-white text-[10px] px-1 rounded">A0</span>
            </div>
            <div class="ml-3 flex-1">
              <div class="flex items-center"><h1 class="font-bold text-lg">${currentUserData.username} 😊</h1></div>
              <p class="text-sm text-gray-600">ID:${currentUserData.userId}</p>
            </div>
            <span>></span>
          </div>

          <!-- STATS -->
          <div class="flex justify-around text-center mt-4">
            <div><p class="font-bold">${currentUserData.friends || 0}</p><p class="text-xs text-gray-500">Friends</p></div>
            <div><p class="font-bold">${currentUserData.following || 6}</p><p class="text-xs text-gray-500">Following</p></div>
            <div><p class="font-bold">${currentUserData.followers || 128}</p><p class="text-xs text-gray-500">Followers</p></div>
            <div><p class="font-bold">${currentUserData.visitors || 2201}</p><p class="text-xs text-gray-500">Visitors</p></div>
          </div>
        </div>

        <!-- COINS + VIP -->
        <div class="flex gap-3 px-4 mt-3">
          <div class="flex-1 bg-yellow-400 rounded-xl p-3 flex items-center"><span class="text-lg">💰</span><span class="ml-2 font-bold">${currentUserData.coins || 6}</span></div>
          <div class="flex-1 bg-gradient-to-r from-yellow-700 to-yellow-500 text-white rounded-xl p-3 flex items-center justify-between"><span>VIP/SVIP</span><span>👑</span></div>
        </div>

        <!-- CP / INVITE -->
        <div class="bg-blue-100 rounded-xl p-3 mx-4 mt-3 flex justify-between items-center">
          <div><p class="text-sm font-bold">Friend</p><p class="text-xs text-gray-600">No Relation</p></div>
          <button class="bg-black text-white px-4 py-1 rounded-full text-sm">Invite</button>
        </div>

        <!-- MAKE MONEY ZONE -->
        <div class="bg-white rounded-xl p-3 mx-4 mt-3 flex justify-between items-center">
          <div class="flex items-center"><span class="text-2xl">💰</span><div class="ml-2"><p class="font-bold text-sm">Make money zone</p><p class="text-xs text-gray-500">Complete mission Daily Di...</p></div></div>
          <button class="bg-red-500 text-white px-3 py-1 rounded-full text-xs">go to complete</button>
        </div>

        <!-- 4 ICONS -->
        <div class="grid grid-cols-4 gap-4 bg-white rounded-xl p-4 mx-4 mt-3 text-center">
          <div><div class="text-2xl">💰</div><p class="text-xs">Income</p></div>
          <div><div class="text-2xl">🏢</div><p class="text-xs">Agency</p></div>
          <div><div class="text-2xl">🏪</div><p class="text-xs">Store</p></div>
          <div><div class="text-2xl">👑</div><p class="text-xs">Aristocracy</p></div>
        </div>

        <!-- MENU LIST -->
        <div class="bg-white rounded-xl mx-4 mt-3">
          ${menuItem('🎒', 'Bag')}
          ${menuItem('📊', 'Level')}
          ${menuItem('🏅', 'Badge')}
          ${menuItem('✅', 'Certification', 'Certified')}
          ${menuItem('🎧', 'Customer service')}
          ${menuItem('💬', 'User Feedback')}
          ${menuItem('⚙️', 'Settings')}
          ${menuItem('🚪', 'Logout', '', true)}
        </div>
        ${nav()}
      </div>`;

      document.getElementById('photoInput').onchange = (e) => {
        const file = e.target.files[0];
        if(file){
          const reader = new FileReader();
          reader.onload = function(event){
            const newPhoto = event.target.result;
            document.getElementById('profilePic').src = newPhoto;
            db.collection("users").doc(currentUser.uid).update({photo: newPhoto});
          }
          reader.readAsDataURL(file);
        }
      }
    }

    function menuItem(icon, title, right='', isRed=false){
      return `<button onclick="${title==='Logout'?'logout()':''}" class="w-full flex items-center justify-between p-4 border-b last:border-0 ${isRed?'text-red-600':''}">
        <div class="flex items-center"><span class="text-xl mr-3">${icon}</span><span>${title}</span></div>
        <div class="flex items-center"><span class="text-sm text-gray-500">${right}</span><span>></span></div>
      </button>`
    }

    function showChat(){ currentPage = 'chat'; root.innerHTML = `<div class="bg-white min-h-screen pb-20"><div class="p-4 border-b"><h1 class="font-bold text-2xl">Chat</h1></div>${nav()}</div>`; }
    function showMoment(){ currentPage = 'moment'; root.innerHTML = `<div class="bg-white min-h-screen pb-20"><div class="p-4 border-b"><h1 class="font-bold text-2xl">Moments</h1></div>${nav()}</div>`; }

    function nav(){
      return `<div class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around py-2 z-50">
        <button onclick="showHome()" class="${currentPage==='home'?'text-pink-500':'text-gray-400'} flex-col items-center">🏠<span class="text-xs">Home</span></button>
        <button onclick="showMoment()" class="${currentPage==='moment'?'text-pink-500':'text-gray-400'} flex-col items-center">⏱️<span class="text-xs">Moment</span></button>
        <button onclick="showChat()" class="${currentPage==='chat'?'text-pink-500':'text-gray-400'} flex-col items-center">💬<span class="text-xs">Chat</span></button>
        <button onclick="showMe()" class="${currentPage==='me'?'text-pink-500':'text-gray-400'} flex-col items-center">👤<span class="text-xs">Me</span></button>
      </div>`
    }
  </script>
</body>
</html>
