<body class="bg-black">
  <div id="root"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // YOUR REAL CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyAXwKw7n28LiJx2W4PBkQG7_glL0sVog8M",
      authDomain: "patanisha-49561.firebaseapp.com",
      projectId: "patanisha-49561",
      storageBucket: "patanisha-49561.firebasestorage.app",
      messagingSenderId: "363879415134",
      appId: "1:363879415134:web:81b99ab93290a3e45723cf",
      measurementId: "G-GLXLGVWLHF"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const root = document.getElementById('root');

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const snap = await getDoc(doc(db, "users", user.uid));
        const userData = snap.data();
        if(userData.gender === "male" && !userData.isPremium){
          showPaywall(user);
        } else {
          showHome(user);
        }
      } else {
        showLogin();
      }
    });

    function showLogin(){
      root.innerHTML = `
      <div class="text-white text-center p-8 max-w-md mx-auto">
        <h1 class="text-pink-500 text-4xl font-bold">Patanisha</h1>
        <input id="email" placeholder="Email" class="w-full p-3 mt-6 bg-gray-800 rounded">
        <input id="pass" type="password" placeholder="Password" class="w-full p-3 mt-3 bg-gray-800 rounded">
        <select id="gender" class="w-full p-3 mt-3 bg-gray-800 rounded">
          <option value="">Select Gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
        <button onclick="signup()" class="bg-pink-500 w-full py-3 rounded mt-4 font-bold">Sign Up</button>
        <button onclick="login()" class="bg-gray-600 w-full py-3 rounded mt-2">Login</button>
      </div>`;
    }

    window.signup = async () => {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('pass').value;
      const gender = document.getElementById('gender').value;
      if(!gender) return alert("Chagua gender kwanza");
      try {
        const userCred = await createUserWithEmailAndPassword(auth, email, pass);
        await setDoc(doc(db, "users", userCred.user.uid), {email, gender, isPremium: gender === "female"});
      } catch(e){ alert(e.message); }
    }

    window.login = async () => {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('pass').value;
      try { await signInWithEmailAndPassword(auth, email, pass); } 
      catch(e){ alert(e.message); }
    }

    function showHome(user){
      root.innerHTML = `
      <div class="text-white text-center p-8">
        <h1 class="text-pink-500 text-3xl">Karibu Patanisha ❤️</h1>
        <p class="mt-4">Logged in as: ${user.email}</p>
        <button onclick="logout()" class="bg-red-500 px-6 py-2 rounded mt-6">Logout</button>
      </div>`;
    }

      root.innerHTML = `
      <div class="bg-black text-white text-center p-8 min-h-screen">
        <h1 class="text-4xl font-bold text-pink-500">Unlock Premium</h1>
        <p class="mt-4">Men pay 500 KES</p>
