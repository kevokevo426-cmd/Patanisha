<!DOCTYPE html>
<html>
<head>
  <title>Patanisha</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black">
  <div id="root"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAhaMwbZkLI2WFKdG7_g1ivg8M",
      authDomain: "patanisha-86567.firebaseapp.com",
      projectId: "patanisha-86567",
      storageBucket: "patanisha-86567.firebasestorage.app",
      messagingSenderId: "83487441514",
      appId: "1:83487441514:web:9ba339a0a46723cf",
      measurementId: "G-6XLOA4H"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const root = document.getElementById('root');
    let currentUser = null;
    let userData = null;

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        const snap = await getDoc(doc(db, "users", user.uid));
        userData = snap.data();
        showHome();
      } else {
        showLogin();
      }
    });

    function showLogin(){
      root.innerHTML = `
      <div class="text-white text-center p-8 max-w-md mx-auto">
        <h1 class="text-pink-500 text-4xl font-bold">Patanisha</h1>
        <input id="email" placeholder="Email" class="w-full p-3 mt-6 bg-gray-800 rounded">
        <input id="pass" type="password" placeholder="Password" class="w-full p-3 mt-3 bg-gray-800 rounded">
        <select id="gender" class="w-full p-3 mt-3 bg-gray-800 rounded">
          <option value="">Select Gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
        <button onclick="signup()" class="bg-pink-500 w-full py-3 rounded mt-4 font-bold">Sign Up</button>
        <button onclick="login()" class="bg-gray-600 w-full py-3 rounded mt-2">Login</button>
      </div>`;
    }

    window.signup = async () => {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('pass').value;
      const gender = document.getElementById('gender').value;
      const userCred = await createUserWithEmailAndPassword(auth, email, pass);
      await setDoc(doc(db, "users", userCred.user.uid), {email, gender, isPremium: gender === "female"});
    }

    window.login = async () => {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('pass').value;
      await signInWithEmailAndPassword(auth, email, pass);
    }

    function showHome(){
      if(userData.gender === "male" && !userData.isPremium){
        showPaywall();
      } else {
        root.innerHTML = `
        <div class="text-white text-center p-8">
          <h1 class="text-pink-500 text-3xl">Karibu Patanisha ❤️</h1>
          <p class="mt-4">Logged in as: ${currentUser.email}</p>
          <button onclick="logout()" class="bg-red-500 px-6 py-2 rounded mt-6">Logout</button>
        </div>`;
      }
    }

    function showPaywall(){
      root.innerHTML = `
      <div class="bg-black text-white text-center p-8 min-h-screen">
        <h1 class="text-4xl font-bold text-pink-500">Unlock Premium</h1>
        <p class="mt-4">Men pay 500 KES to access</p>
        <input id="txCode" placeholder="M-Pesa Code" class="w-full p-3 mt-6 bg-gray-800 rounded">
        <button onclick="submitPayment()" class="bg-green-500 px-6 py-3 rounded mt-4">Submit Payment</button>
        <button onclick="logout()" class="bg-red-500 px-6 py-2 rounded mt-4">Logout</button>
      </div>`;
    }

    window.submitPayment = async () => {
      const txCode = document.getElementById('txCode').value;
      if(!txCode) return alert("Weka transaction code kwanza");
      await addDoc(collection(db, "payments"), {userId: currentUser.uid, email: currentUser.email, txCode, amount: 500});
      alert("Tumepokea! We will unlock you in 10 minutes");
    }

    window.logout = async () => {
      await signOut(auth);
      alert("Logged out successfully!");
      window.location.reload();
    }
  </script>
</body>
</html>
