<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Patanisha</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    body { -webkit-font-smoothing: antialiased; }
   .hide-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-gray-50">
  <div id="root">Loading Patanisha...</div>
  <input type="file" id="photoInput" accept="image/*" style="display:none">

  <script>
    // 1. FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyAXwKw7n28LiJx2W4PBkQG7_glL0sVog8M",
      authDomain: "patanisha-49561.firebaseapp.com",
      projectId: "patanisha-49561",
      storageBucket: "patanisha-49561.firebasestorage.app",
      messagingSenderId: "363879415134",
      appId: "1:363879415134:web:81b99ab93290a3e45723cf"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const root = document.getElementById('root');
    let currentPage = 'home';
    let currentUser = null;
    let currentUserData = {};
    let allUsers = [];
    let chats = [];

    // 2. AUTH STATE
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        currentUser = user;
        const snap = await db.collection("users").doc(user.uid).get();
        currentUserData = snap.data() || {};
        if(currentUserData.gender === "male" &&!currentUserData.isPremium){
          showPaywall();
        } else {
          loadUsers();
          loadChats();
        }
      } else {
        showLogin();
      }
    });

    // 3. LOAD DATA
    async function loadUsers(){
      const snapshot = await db.collection("users").get();
      allUsers = [];
      snapshot.forEach(doc => { if(doc.id!== currentUser.uid){ allUsers.push({id: doc.id,...doc.data()}); } });
      if(currentPage === 'home') showHome();
    }

    function loadChats(){
      db.collection("chats").where("members", "array-contains", currentUser.uid).orderBy("lastMessageTime", "desc").onSnapshot(snapshot => {
        chats = [];
        snapshot.forEach(doc => { chats.push({id: doc.id,...doc.data()}); });
        if(currentPage === 'chat') showChat();
      });
    }

    // 4. AUTH PAGES
    function showLogin(){
      root.innerHTML = `
      <div class="text-white text-center p-8 max-w-md mx-auto min-h-screen flex flex-col justify-center bg-black">
        <h1 class="text-pink-500 text-4xl font-bold">Patanisha ❤️</h1>
        <p class="text-gray-400 mb-6">Find your match</p>
        <input id="email" placeholder="Email" class="w-full p-3 mt-4 bg-gray-800 rounded text-white">
        <input id="pass" type="password" placeholder="Password" class="w-full p-3 mt-3 bg-gray-800 rounded text-white">
        <select id="gender" class="w-full p-3 mt-3 bg-gray-800 rounded text-white">
          <option value="">Select Gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
        <button onclick="signup()" class="bg-pink-500 w-full py-3 rounded mt-4 font-bold">Sign Up</button>
        <button onclick="login()" class="bg-gray-600 w-full py-3 rounded mt-2">Login</button>
      </div>`;
    }

    function signup(){
      const email = document.getElementById('email').value;
      const pass = document.getElementById('pass').value;
      const gender = document.getElementById('gender').value;
      if(!gender) return alert("Chagua gender kwanza");
      const username = "User" + Math.floor(Math.random()*9999);
      const userId = "PT" + Math.floor(Math.random()*900000 + 100000);
      auth.createUserWithEmailAndPassword(email, pass).then(userCred => {
        db.collection("users").doc(userCred.user.uid).set({
          email, gender, username, userId,
          photo: `https://i.pravatar.cc/150?u=${userCred.user.uid}`,
          age: Math.floor(Math.random()*15)+20,
          isPremium: gender === "female",
          createdAt: Date.now()
        });
      }).catch(e => alert(e.message));
    }

    function login(){
      const email = document.getElementById('email').value;
      const pass = document.getElementById('pass').value;
      auth.signInWithEmailAndPassword(email, pass).catch(e => alert(e.message));
    }

    function logout(){ auth.signOut(); }

    // 5. PAYWALL
    function showPaywall(){
      root.innerHTML = `
      <div class="bg-black text-white text-center p-8 min-h-screen flex flex-col justify-center">
        <h1 class="text-4xl font-bold text-pink-500">Unlock Premium</h1>
        <p class="mt-4 text-lg">Men pay 500 KES to chat & see profiles</p>
        <button onclick="alert('M-Pesa STK coming soon')" class="bg-gradient-to-r from-pink-500 to-red-500 px-8 py-3 rounded-full mt-6 font-bold">Pay with M-Pesa</button>
        <button onclick="logout()" class="bg-gray-600 px-8 py-3 rounded-full mt-3">Logout</button>
      </div>`;
    }

    // 6. HOME PAGE
    function showHome(){
      currentPage = 'home';
      const men = allUsers.filter(u => u.gender === "male");
      root.innerHTML = `
      <div class="bg-white min-h-screen pb-20">
        <div class="bg-gradient-to-r from-yellow-300 to-orange-300 rounded-2xl mx-3 mt-3 p-4 flex items-center shadow">
          <div class="flex-1">
            <h2 class="font-bold text-black">Find New People</h2>
            <p class="text-sm text-gray-800">${men.length} men online now</p>
          </div>
          <img src="https://cdn-icons-png.flaticon.com/512/8913/8913995.png" class="w-16 h-16" />
        </div>
        <div class="px-3 mt-4 space-y-4 hide-scrollbar overflow-y-auto">
          ${men.length === 0? '<p class="text-center text-gray-500 mt-10">No men yet. Invite friends!</p>' : ''}
          ${men.map(user => userCard(user)).join('')}
        </div>
        ${nav()}
      </div>`;
    }

    async function startChat(otherUserId, name, photo){
      const chatId = [currentUser.uid, otherUserId].sort().join("_");
      const chatRef = db.collection("chats").doc(chatId);
      const doc = await chatRef.get();
      if(!doc.exists){
        await chatRef.set({
          members: [currentUser.uid, otherUserId],
          memberInfo: {
            [currentUser.uid]: {name: currentUserData.username, photo: currentUserData.photo},
            [otherUserId]: {name, photo}
          },
          lastMessage: "Hi! 👋",
          lastMessageTime: Date.now()
        });
      }
      openChat(chatId, name, photo);
    }

    function userCard(user){
      return `<div class="flex items-center bg-white p-3 rounded-xl shadow-sm">
        <div class="relative">
          <img src="${user.photo}" class="w-16 h-16 rounded-full border-2 border-pink-400"/>
          <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-white"></div>
        </div>
        <div class="ml-3 flex-1">
          <p class="font-bold text-black">${user.username} ${user.isPremium?`<span class="text-xs bg-green-500 text-white px-2 rounded ml-1">VIP</span>`:""}</p>
          <p class="text-sm text-gray-500">♂ ${user.age} yrs | ID: ${user.userId}</p>
        </div>
        <button onclick="startChat('${user.id}', '${user.username}', '${user.photo}')" class="bg-gradient-to-r from-yellow-400 to-orange-400 text-white px-5 py-2 rounded-full font-bold">💬 Hi</button>
      </div>`;
    }

    // 7. CHAT LIST PAGE
    function showChat(){
      currentPage = 'chat';
      root.innerHTML = `
      <div class="bg-white min-h-screen pb-20">
        <div class="sticky top-0 bg-white p-4 border-b z-10"><h1 class="font-bold text-2xl">Chat</h1></div>
        <div>
          ${chats.length === 0? '<p class="text-center text-gray-500 mt-10">No chats yet. Tap Hi on Home</p>' : ''}
          ${chats.map(chat => {
            const otherId = chat.members.find(id => id!== currentUser.uid);
            const other = chat.memberInfo[otherId];
            const time = new Date(chat.lastMessageTime).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            return chatItem(other.name, other.photo, chat.lastMessage, chat.id, time);
          }).join('')}
        </div>
        ${nav()}
      </div>`;
    }

    function chatItem(name, photo, lastMsg, chatId, time){
      return `<button onclick="openChat('${chatId}', '${name}', '${photo}')" class="w-full flex items-center p-4 border-b hover:bg-gray-50 text-left">
        <img src="${photo}" class="w-12 h-12 rounded-full"/>
        <div class="ml-3 flex-1">
          <div class="flex justify-between">
            <p class="font-bold text-black">${name}</p>
            <p class="text-xs text-gray-400">${time}</p>
          </div>
          <p class="text-sm text-gray-500 truncate">${lastMsg}</p>
        </div>
      </button>`;
    }

    // 8. SINGLE CHAT WINDOW
    function openChat(chatId, name, photo){
      currentPage = 'chatWindow';
      root.innerHTML = `
      <div class="bg-gray-100 min-h-screen flex-col">
        <div class="bg-white p-4 flex items-center border-b shadow-sm">
          <button onclick="showChat()" class="text-2xl">←</button>
          <img src="${photo}" class="w-10 h-10 rounded-full ml-3" />
          <div class="ml-3">
            <h3 class="font-bold">${name}</h3>
            <p class="text-xs text-green-500">Online</p>
          </div>
        </div>
        <div id="messages" class="flex-1 p-4 space-y-2 overflow-y-auto"></div>
        <div class="bg-white p-3 flex border-t">
          <input id="msgInput" placeholder="Type a message..." class="flex-1 bg-gray-100 rounded-full px-4">
          <button onclick="sendMessage('${chatId}')" class="bg-yellow-400 w-10 h-10 rounded-full ml-2 flex items-center justify-center">➤</button>
        </div>
      </div>`;
      loadMessages(chatId);
    }

    function loadMessages(chatId){
      db.collection("chats").doc(chatId).collection("messages").orderBy("time", "asc").onSnapshot(snapshot => {
        const msgDiv = document.getElementById('messages');
        if(!msgDiv) return;
        msgDiv.innerHTML = '';
        snapshot.forEach(doc => {
          const msg = doc.data();
          const isMe = msg.sender === currentUser.uid;
          msgDiv.innerHTML += `<div class="flex ${isMe?'justify-end':'justify-start'}"><div class="${isMe?'bg-yellow-300':'bg-white'} p-3 rounded-2xl max-w-[70%] shadow">${msg.text}</div></div>`;
        });
        msgDiv.scrollTop = msgDiv.scrollHeight;
      });
    }

    function sendMessage(chatId){
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if(text === "") return;
      db.collection("chats").doc(chatId).collection("messages").add({ text, sender: currentUser.uid, time: Date.now() });
      db.collection("chats").doc(chatId).update({ lastMessage: text, lastMessageTime: Date.now() });
      input.value = "";
    }

    // 9. MOMENT PAGE
    function showMoment(){
      currentPage = 'moment';
      root.innerHTML = `<div class="bg-white min-h-screen pb-20"><div class="p-4 border-b"><h1 class="font-bold text-2xl">Moments</h1></div><p class="text-center mt-10 text-gray-500">Coming Soon</p>${nav()}</div>`;
    }

    // 10. ME PAGE - EDITABLE PROFILE
    function showMe(){
      currentPage = 'me';
      root.innerHTML = `
      <div class="bg-white min-h-screen pb-20">
        <div class="bg-gradient-to-r from-pink-500 to-red-500 p-8 text-white text-center">
          <div class="relative inline-block">
            <img id="profilePic" src="${currentUserData.photo}" class="w-28 h-28 rounded-full mx-auto border-4 border-white"/>
            <button onclick="document.getElementById('photoInput').click()" class="absolute bottom-0 right-0 bg-black bg-opacity-60 rounded-full w-8 h-8 flex items-center justify-center">📷</button>
          </div>
          <h1 id="displayName" class="font-bold text-2xl mt-3">${currentUserData.username}</h1>
          <p class="text-sm opacity-90">ID: ${currentUserData.userId}</p>
          <p class="text-sm opacity-90">${currentUserData.email}</p>
        </div>

        <div class="p-4 space-y-4">
          <div class="bg-gray-100 p-4 rounded-xl">
            <p class="text-sm text-gray-500">Username</p>
            <div class="flex items-center mt-1">
              <input id="nameInput" value="${currentUserData.username}" class="flex-1 bg-white p-2 rounded border">
              <button onclick="updateName()" class="ml-2 bg-pink-500 text-white px-4 py-2 rounded">Save</button>
            </div>
          </div>
          <button class="w-full text-left p-4 bg-gray-100 rounded-xl">⚙️ Settings</button>
          <button class="w-full text-left p-4 bg-gray-100 rounded-xl">💎 Buy Coins</button>
          <button onclick="logout()" class="w-full text-left p-4 bg-red-100 text-red-600 rounded-xl">🚪 Logout</button>
        </div>
        ${nav()}
      </div>`;

      document.getElementById('photoInput').onchange = (e) => {
        const file = e.target.files[0];
        if(file){
          const reader = new FileReader();
          reader.onload = function(event){
            const newPhoto = event.target.result;
            document.getElementById('profilePic').src = newPhoto;
            db.collection("users").doc(currentUser.uid).update({photo: newPhoto});
            currentUserData.photo = newPhoto;
            alert("Profile photo updated!");
          }
          reader.readAsDataURL(file);
        }
      }
    }

    function updateName(){
      const newName = document.getElementById('nameInput').value.trim();
      if(newName === "") return alert("Name cannot be empty");
      db.collection("users").doc(currentUser.uid).update({username: newName});
      currentUserData.username = newName;
      document.getElementById('displayName').innerText = newName;
      alert("Username updated!");
    }

    // 11. BOTTOM NAV
    function nav(){
      return `<div class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around py-2 z-50">
        <button onclick="showHome()" class="${currentPage==='home'?'text-pink-500':'text-gray-400'} flex-col items-center">
          <svg width="24" height="24" fill="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
          <span class="text-xs">Home</span>
        </button>
        <button onclick="showMoment()" class="${currentPage==='moment'?'text-pink-500':'text-gray-400'} flex flex-col items-center">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          <span class="text-xs">Moment</span>
        </button>
        <button onclick="showChat()" class="${currentPage==='chat' || currentPage==='chatWindow'?'text-pink-500':'text-gray-400'} flex flex-col items-center">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          <span class="text-xs">Chat</span>
        </button>
        <button onclick="showMe()" class="${currentPage==='me'?'text-pink-500':'text-gray-400'} flex flex-col items-center">
          <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <span class="text-xs">Me</span>
        </button>
      </div>`
    }
  </script>
</body>
</html>
