<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patanisha</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100">
  <div id="root">Loading Patanisha...</div>
  <input type="file" id="photoInput" accept="image/*" style="display:none">

  <script>
    // YOUR CONFIG FROM FIREBASE - SAME AS SCREENSHOT
    const firebaseConfig = {
      apiKey: "AIzaSyAXwKw7n28LiJx2W4PBkQG7_glL0sVog8M",
      authDomain: "patanisha-49561.firebaseapp.com",
      projectId: "patanisha-49561",
      storageBucket: "patanisha-49561.firebasestorage.app",
      messagingSenderId: "363879415134",
      appId: "1:363879415134:web:81b99ab93290a3e45723cf",
      measurementId: "G-GLXLGWLHF"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const root = document.getElementById('root');
    let currentUser = null;
    let currentUserData = {};
    let allUsers = [];

    auth.onAuthStateChanged(async (user) => {
      if (user) {
        currentUser = user;
        await ensureUserData(user.uid);
        loadUsers();
        showHome();
      } else {
        showLogin();
      }
    });

    async function ensureUserData(uid){
      const docRef = db.collection("users").doc(uid);
      const snap = await docRef.get();
      if(!snap.exists){
        await docRef.set({
          username: "User" + Math.floor(Math.random()*9999),
          userId: "PT" + Math.floor(Math.random()*900000 + 100000),
          photo: `https://i.pravatar.cc/150?u=${uid}`,
          coins: 6, diamonds: 0, friends: 0, following: 0, followers: 0, visitors: 0,
          totalIncome: 0, todayIncome: 0, gender: "female", isPremium: true
        });
      }
      currentUserData = (await docRef.get()).data();
    }

    async function loadUsers(){
      const snapshot = await db.collection("users").get();
      allUsers = [];
      snapshot.forEach(doc => { if(doc.id!== currentUser.uid){ allUsers.push({id: doc.id,...doc.data()}); } });
    }

    function showLogin(){
      root.innerHTML = `<div class="text-white text-center p-8 max-w-md mx-auto min-h-screen flex flex-col justify-center bg-black"><h1 class="text-pink-500 text-4xl font-bold">Patanisha ❤️</h1><input id="email" placeholder="Email" class="w-full p-3 mt-6 bg-gray-800 rounded text-white"><input id="pass" type="password" placeholder="Password" class="w-full p-3 mt-3 bg-gray-800 rounded text-white"><select id="gender" class="w-full p-3 mt-3 bg-gray-800 rounded text-white"><option value="">Select Gender</option><option value="male">Male</option><option value="female">Female</option></select><button onclick="signup()" class="bg-pink-500 w-full py-3 rounded mt-4 font-bold">Sign Up</button><button onclick="login()" class="bg-gray-600 w-full py-3 rounded mt-2">Login</button></div>`;
    }
    function signup(){
      const email = document.getElementById('email').value;
      const pass = document.getElementById('pass').value;
      const gender = document.getElementById('gender').value;
      if(!gender) return alert("Chagua gender kwanza");
      auth.createUserWithEmailAndPassword(email, pass).then(cred => {
        db.collection("users").doc(cred.user.uid).set({
          email, gender,
          username: "User" + Math.floor(Math.random()*9999),
          userId: "PT" + Math.floor(Math.random()*900000 + 100000),
          photo: `https://i.pravatar.cc/150?u=${cred.user.uid}`,
          coins: 6, diamonds: 0, isPremium: gender === "female"
        })
      }).catch(e => alert(e.message));
    }
    function login(){ const email = document.getElementById('email').value; const pass = document.getElementById('pass').value; auth.signInWithEmailAndPassword(email, pass).catch(e => alert(e.message)); }
    function logout(){ auth.signOut(); }
    
    function showHome(){ 
      root.innerHTML = `<div class="bg-white min-h-screen pb-20">
        <div class="p-4 bg-pink-500 text-white"><h1 class="font-bold text-2xl">Patanisha</h1><p>Hi ${currentUserData.username}</p></div>
        <div class="px-3 mt-4 space-y-4">${allUsers.map(user => `<div class="flex items-center bg-white p-3 rounded-xl shadow-sm"><img src="${user.photo || 'https://i.pravatar.cc/150'}" class="w-16 h-16 rounded-full"/><div class="ml-3 flex-1"><p class="font-bold">${user.username || 'No Name'}</p><p class="text-sm text-gray-500">ID: ${user.userId}</p></div></div>`).join('')}</div>
        <button onclick="showMe()" class="fixed bottom-20 right-4 bg-pink-500 text-white w-14 h-14 rounded-full text-2xl">👤</button>
        <button onclick="logout()" class="fixed bottom-20 left-4 bg-red-500 text-white px-4 py-2 rounded">Logout</button>
      </div>`; 
    }

    function showMe(){
      root.innerHTML = `
      <div class="min-h-screen pb-20">
        <div class="bg-gradient-to-b from-yellow-100 to-white p-4">
          <div class="flex items-center">
            <img src="${currentUserData.photo}" onclick="document.getElementById('photoInput').click()" class="w-16 h-16 rounded-full border-2 border-white"/>
            <div class="ml-3 flex-1"><h1 class="font-bold text-lg">${currentUserData.username} 😊</h1><p class="text-sm text-gray-600">ID:${currentUserData.userId}</p></div>
          </div>
          <div class="flex justify-around text-center mt-4">
            <div><p class="font-bold">${currentUserData.friends || 0}</p><p class="text-xs text-gray-500">Friends</p></div>
            <div><p class="font-bold">${currentUserData.following || 0}</p><p class="text-xs text-gray-500">Following</p></div>
            <div><p class="font-bold">${currentUserData.followers || 0}</p><p class="text-xs text-gray-500">Followers</p></div>
            <div><p class="font-bold">${currentUserData.visitors || 0}</p><p class="text-xs text-gray-500">Visitors</p></div>
          </div>
        </div>
        <button onclick="showHome()" class="m-4 bg-gray-300 px-4 py-2 rounded">← Back Home</button>
      </div>`;
    }
  </script>
</body>
</html>
