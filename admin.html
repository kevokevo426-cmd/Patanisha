<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patanisha Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100">
  <div id="root">Loading Admin...</div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAXwKw7n28LiJx2W4PBkQG7_glL0sVog8M",
      authDomain: "patanisha-49561.firebaseapp.com",
      projectId: "patanisha-49561",
      storageBucket: "patanisha-49561.firebasestorage.app",
      messagingSenderId: "363879415134",
      appId: "1:363879415134:web:81b99ab93290a3e45723cf"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const root = document.getElementById('root');
    
    const ADMIN_EMAIL = "kevokevo426@gmail.com"; // CHANGE THIS TO YOUR ADMIN EMAIL

    auth.onAuthStateChanged(async (user) => {
      if (user && user.email === ADMIN_EMAIL) {
        showAdminPanel();
      } else if (user) {
        root.innerHTML = `<div class="p-8 text-center">Access Denied. Not Admin.</div>`;
        auth.signOut();
      } else {
        showLogin();
      }
    });

    function showLogin(){
      root.innerHTML = `<div class="text-white text-center p-8 max-w-md mx-auto min-h-screen flex flex-col justify-center bg-black">
        <h1 class="text-pink-500 text-3xl font-bold">Patanisha Admin</h1>
        <input id="email" placeholder="Admin Email" class="w-full p-3 mt-6 bg-gray-800 rounded text-white">
        <input id="pass" type="password" placeholder="Password" class="w-full p-3 mt-3 bg-gray-800 rounded text-white">
        <button onclick="login()" class="bg-pink-500 w-full py-3 rounded mt-4 font-bold">Login</button>
      </div>`;
    }
    function login(){ const email = document.getElementById('email').value; const pass = document.getElementById('pass').value; auth.signInWithEmailAndPassword(email, pass).catch(e => alert(e.message)); }
    function logout(){ auth.signOut(); }

    async function showAdminPanel(){
      const usersSnap = await db.collection("users").get();
      const users = usersSnap.docs.map(doc => ({id: doc.id, ...doc.data()}));
      const paymentsSnap = await db.collection("payments").where("status", "==", "pending").get();
      const payments = paymentsSnap.docs.map(doc => ({id: doc.id, ...doc.data()}));

      const totalCoins = users.reduce((sum, u) => sum + (u.coins || 0), 0);
      const totalDiamonds = users.reduce((sum, u) => sum + (u.diamonds || 0), 0);

      root.innerHTML = `
      <div class="p-4 max-w-5xl mx-auto">
        <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow">
          <h1 class="text-2xl font-bold text-pink-500">Patanisha Admin</h1>
          <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded">Logout</button>
        </div>

        <div class="grid grid-cols-3 gap-4 mt-4">
          <div class="bg-white p-4 rounded-xl shadow"><p class="text-gray-500">Total Users</p><p class="text-2xl font-bold">${users.length}</p></div>
          <div class="bg-white p-4 rounded-xl shadow"><p class="text-gray-500">Total Coins</p><p class="text-2xl font-bold">S ${totalCoins}</p></div>
          <div class="bg-white p-4 rounded-xl shadow"><p class="text-gray-500">Total Diamonds</p><p class="text-2xl font-bold">💎 ${totalDiamonds}</p></div>
        </div>

        <div class="bg-white p-4 rounded-xl shadow mt-4">
          <h2 class="font-bold text-lg mb-3">Pending Withdrawals: ${payments.length}</h2>
          ${payments.length === 0 ? '<p class="text-gray-500">No pending withdrawals</p>' : 
            payments.map(p => `
              <div class="border p-3 rounded mb-2">
                <p><b>User:</b> ${p.username || 'N/A'} (${p.userId || ''})</p>
                <p><b>Amount:</b> S ${p.amount}</p>
                <p><b>Method:</b> ${p.method} - ${p.account}</p>
                <button onclick="approvePayment('${p.id}', '${p.userId}')" class="bg-green-500 text-white px-3 py-1 rounded mt-2">Approve</button>
                <button onclick="rejectPayment('${p.id}')" class="bg-red-500 text-white px-3 py-1 rounded mt-2 ml-2">Reject</button>
              </div>
            `).join('')
          }
        </div>

        <div class="bg-white p-4 rounded-xl shadow mt-4">
          <h2 class="font-bold text-lg mb-3">Manage Users</h2>
          <input id="search" onkeyup="searchUser()" placeholder="Search by username, ID, email" class="w-full p-2 border rounded mb-3">
          <div id="userList">${renderUsers(users)}</div>
        </div>
      </div>
      `;
      window.allUsers = users;
    }

    function renderUsers(users){
      return users.map(u => `
        <div class="flex items-center justify-between border-b py-2">
          <div class="flex items-center">
            <img src="${u.photo}" class="w-10 h-10 rounded-full mr-3">
            <div>
              <p class="font-bold">${u.username || 'undefined'} ${u.isBanned ? '🚫' : ''}</p>
              <p class="text-xs text-gray-500">ID: ${u.id || 'N/A'} | Coins: ${u.coins || 0} | Diamonds: ${u.diamonds || 0}</p>
            </div>
          </div>
          <div>
            <button onclick="addCoins('${u.id}')" class="bg-yellow-400 text-xs px-2 py-1 rounded">+100 Coins</button>
            <button onclick="toggleBan('${u.id}', ${u.isBanned})" class="${u.isBanned ? 'bg-green-500' : 'bg-red-500'} text-white text-xs px-2 py-1 rounded ml-1">${u.isBanned ? 'Unban' : 'Ban'}</button>
            <button onclick="deleteUser('${u.id}')" class="bg-gray-500 text-white text-xs px-2 py-1 rounded ml-1">Delete</button>
          </div>
        </div>
      `).join('');
    }

    function searchUser(){
      const val = document.getElementById('search').value.toLowerCase();
      const filtered = window.allUsers.filter(u => 
        (u.username && u.username.toLowerCase().includes(val)) || 
        (u.id && u.id.toLowerCase().includes(val)) ||
        (u.email && u.email.toLowerCase().includes(val))
      );
      document.getElementById('userList').innerHTML = renderUsers(filtered);
    }

    async function addCoins(userId){
      await db.collection("users").doc(userId).update({coins: firebase.firestore.FieldValue.increment(100)});
      alert("100 Coins Added!");
      showAdminPanel();
    }

    async function toggleBan(userId, isBanned){
      await db.collection("users").doc(userId).update({isBanned: !isBanned});
      alert(isBanned ? "User Unbanned" : "User Banned");
      showAdminPanel();
    }

    async function deleteUser(userId){
      if(confirm("Delete this user?")){
        await db.collection("users").doc(userId).delete();
        showAdminPanel();
      }
    }

    async function approvePayment(paymentId, userId){
      await db.collection("payments").doc(paymentId).update({status: "approved"});
      alert("Payment Approved!");
      showAdminPanel();
    }

    async function rejectPayment(paymentId){
      await db.collection("payments").doc(paymentId).update({status: "rejected"});
      alert("Payment Rejected!");
      showAdminPanel();
    }
  </script>
</body>
</html>
