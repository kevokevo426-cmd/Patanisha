<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patanisha Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100">
  <div id="adminPanel" class="hidden">
    <div class="bg-pink-500 text-white p-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold">Patanisha Admin 👑</h1>
      <button onclick="logout()" class="bg-red-500 px-4 py-2 rounded">Logout</button>
    </div>

    <div class="p-4">
      <input id="searchInput" onkeyup="searchUsers()" placeholder="Search by username or ID..." class="w-full p-3 border rounded mb-4">
      <div id="stats" class="grid grid-cols-3 gap-4 mb-4"></div>
      <div id="usersList" class="space-y-3"></div>
    </div>
  </div>

  <div id="loginBox" class="min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-lg w-96">
      <h1 class="text-2xl font-bold text-center mb-4 text-pink-500">Admin Login</h1>
      <input id="adminEmail" type="email" placeholder="Admin Email" class="w-full p-3 border rounded mb-3">
      <input id="adminPass" type="password" placeholder="Password" class="w-full p-3 border rounded mb-3">
      <button onclick="adminLogin()" class="bg-pink-500 text-white w-full py-3 rounded font-bold">Login</button>
      <p id="error" class="text-red-500 text-sm mt-2"></p>
    </div>
  </div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAXwKw7n28LiJx2W4PBkQG7_glL0sVog8M",
    authDomain: "patanisha-49561.firebaseapp.com",
    projectId: "patanisha-49561",
    storageBucket: "patanisha-49561.firebasestorage.app",
    messagingSenderId: "363879415134",
    appId: "1:363879415134:web:81b99ab93290a3e45723cf"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  
  let allUsers = [];

  // CHANGE THIS TO YOUR EMAIL TO BECOME ADMIN
  const ADMIN_EMAIL = "youradminemail@gmail.com"; 

  auth.onAuthStateChanged(async (user) => {
    if(user && user.email === ADMIN_EMAIL){
      document.getElementById('loginBox').classList.add('hidden');
      document.getElementById('adminPanel').classList.remove('hidden');
      loadUsers();
    } else {
      document.getElementById('loginBox').classList.remove('hidden');
      document.getElementById('adminPanel').classList.add('hidden');
    }
  });

  function adminLogin(){
    const email = document.getElementById('adminEmail').value;
    const pass = document.getElementById('adminPass').value;
    auth.signInWithEmailAndPassword(email, pass).catch(e => {
      document.getElementById('error').innerText = e.message;
    });
  }

  function logout(){ auth.signOut(); }

  async function loadUsers(){
    const snap = await db.collection("users").get();
    allUsers = [];
    let totalCoins = 0, totalDiamonds = 0;
    
    snap.forEach(doc => {
      const data = doc.data();
      data.id = doc.id;
      allUsers.push(data);
      totalCoins += data.coins || 0;
      totalDiamonds += data.diamonds || 0;
    });

    document.getElementById('stats').innerHTML = `
      <div class="bg-white p-4 rounded shadow"><p class="text-gray-500">Total Users</p><p class="text-2xl font-bold">${allUsers.length}</p></div>
      <div class="bg-white p-4 rounded shadow"><p class="text-gray-500">Total Coins</p><p class="text-2xl font-bold">S ${totalCoins}</p></div>
      <div class="bg-white p-4 rounded shadow"><p class="text-gray-500">Total Diamonds</p><p class="text-2xl font-bold">💎 ${totalDiamonds}</p></div>
    `;
    renderUsers(allUsers);
  }

  function renderUsers(users){
    const list = document.getElementById('usersList');
    list.innerHTML = users.map(u => `
      <div class="bg-white p-4 rounded shadow flex items-center justify-between">
        <div class="flex items-center gap-3">
          <img src="${u.photo}" class="w-12 h-12 rounded-full">
          <div>
            <p class="font-bold">${u.username}</p>
            <p class="text-xs text-gray-500">ID: ${u.userId}</p>
            <p class="text-sm">💰 ${u.coins} | 💎 ${u.diamonds}</p>
          </div>
        </div>
        <div class="flex gap-2">
          <button onclick="addCoins('${u.id}')" class="bg-yellow-400 px-3 py-1 rounded text-sm">+100 Coins</button>
          <button onclick="deleteUser('${u.id}')" class="bg-red-500 text-white px-3 py-1 rounded text-sm">Delete</button>
        </div>
      </div>
    `).join('');
  }

  function searchUsers(){
    const term = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allUsers.filter(u => 
      u.username.toLowerCase().includes(term) || 
      u.userId.toLowerCase().includes(term)
    );
    renderUsers(filtered);
  }

  async function addCoins(uid){
    await db.collection("users").doc(uid).update({
      coins: firebase.firestore.FieldValue.increment(100)
    });
    alert("Added 100 coins");
    loadUsers();
  }

  async function deleteUser(uid){
    if(confirm("Delete this user?")){
      await db.collection("users").doc(uid).delete();
      loadUsers();
    }
  }
</script>
</body>
</html>
