<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patanisha Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100">
  <div class="container mx-auto p-4">
    <h1 class="text-3xl font-bold text-orange-500 mb-6">🔥 Patanisha Admin Panel</h1>
    
    <!-- Login Section -->
    <div id="loginSection" class="bg-white p-6 rounded-lg shadow mb-6">
      <h2 class="text-xl font-bold mb-4">Admin Login</h2>
      <input type="email" id="email" placeholder="Admin Email" class="border p-2 w-full mb-3 rounded">
      <input type="password" id="password" placeholder="Password" class="border p-2 w-full mb-3 rounded">
      <button onclick="login()" class="bg-orange-500 text-white px-4 py-2 rounded w-full">Login</button>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="hidden">
      <div class="grid grid-cols-3 gap-4 mb-6">
        <div class="bg-yellow-400 p-4 rounded-lg">
          <p class="text-sm">Total Users</p>
          <h2 class="text-2xl font-bold" id="totalUsers">0</h2>
        </div>
        <div class="bg-green-400 p-4 rounded-lg">
          <p class="text-sm">Online</p>
          <h2 class="text-2xl font-bold" id="onlineUsers">0</h2>
        </div>
        <div class="bg-purple-400 p-4 rounded-lg">
          <p class="text-sm">VIP Users</p>
          <h2 class="text-2xl font-bold" id="vipUsers">0</h2>
        </div>
      </div>

      <div class="bg-white p-4 rounded-lg shadow">
        <h3 class="font-bold mb-3">All Users</h3>
        <table class="w-full">
          <thead>
            <tr class="border-b">
              <th class="text-left p-2">Name</th>
              <th class="text-left p-2">Friends</th>
              <th class="text-left p-2">City</th>
              <th class="text-left p-2">Action</th>
            </tr>
          </thead>
          <tbody id="userTable"></tbody>
        </table>
      </div>
    </div>
  </div>

<script>
  // TODO: PASTE YOUR FIREBASE CONFIG HERE
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    projectId: "YOUR_PROJECT_ID",
    // ... rest of config
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  function login(){
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    firebase.auth().signInWithEmailAndPassword(email, password)
      .then(() => {
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        loadUsers();
      })
      .catch(err => alert(err.message));
  }

  function loadUsers(){
    db.collection("users").onSnapshot(snapshot => {
      let html = '';
      document.getElementById('totalUsers').innerText = snapshot.size;
      snapshot.forEach(doc => {
        const u = doc.data();
        html += `
        <tr class="border-b">
          <td class="p-2">${u.name}</td>
          <td class="p-2">${u.friends}</td>
          <td class="p-2">${u.city}</td>
          <td class="p-2">
            <button onclick="addFriends('${doc.id}')" class="bg-green-500 text-white px-2 py-1 rounded text-sm">+5</button>
          </td>
        </tr>`
      });
      document.getElementById('userTable').innerHTML = html;
    });
  }

  function addFriends(id){
    db.collection("users").doc(id).update({
      friends: firebase.firestore.FieldValue.increment(5)
    });
  }
</script>
</body>
</html>
