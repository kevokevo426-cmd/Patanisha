<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patanisha - Home</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f0f2f5; }
    
    #loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-size: 20px;
      color: #E91E63;
      font-weight: bold;
    }
    
    #app { display: none; }
    
    .header {
      background: #E91E63;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      position: sticky;
      top: 0;
    }
    
    .nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: white;
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      border-top: 1px solid #ddd;
      box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
    }
    
    .nav button {
      background: none;
      border: none;
      font-size: 14px;
      color: #666;
      cursor: pointer;
      flex: 1;
    }
    
    .nav button.active { color: #E91E63; font-weight: bold; }
    
    .page { padding: 20px; padding-bottom: 80px; }
    .hidden { display: none; }
    
    #logoutBtn {
      background:red;
      color:white;
      padding:10px 20px;
      border:none;
      border-radius:8px;
      margin-top:15px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="loading">Loading Patanisha...</div>

  <div id="app">
    <div class="header">Patanisha ❤️</div>
    
    <div id="home-page" class="page">
      <h2>Welcome Home!</h2>
      <p>Find and connect with people near you.</p>
    </div>
    
    <div id="chat-page" class="page hidden">
      <h2>Chats</h2>
      <p>Your conversations will appear here.</p>
    </div>
    
    <div id="me-page" class="page hidden">
      <h2>My Profile</h2>
      <p id="user-email"></p>
      <button id="logoutBtn">Logout</button>
    </div>

    <div class="nav">
      <button class="nav-btn active" data-page="home-page">Home</button>
      <button class="nav-btn" data-page="chat-page">Chat</button>
      <button class="nav-btn" data-page="me-page">Me</button>
    </div>
  </div>


<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  // YOUR FIREBASE CONFIG FROM SCREENSHOT
  const firebaseConfig = {
    apiKey: "AIzaSyAXwKw7n28LiJx2W4PBkQG7_g1L0sVog8M",
    authDomain: "patanisha-49561.firebaseapp.com",
    projectId: "patanisha-49561",
    storageBucket: "patanisha-49561.firebasestorage.app",
    messagingSenderId: "363879415134",
    appId: "1:363879415134:web:81b99ab93290a3e45723cf"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // CHECK LOGIN - FIX YA KUSTUCK
  onAuthStateChanged(auth, (user) => {
    if (user) {
      // User ame-login
      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.getElementById('user-email').innerText = "Email: " + user.email;
    } else {
      // Hakuna user - RUDI LOGIN
      window.location.href = 'login.html';
    }
  });

  // NAVIGATION
  const navBtns = document.querySelectorAll('.nav-btn');
  const pages = document.querySelectorAll('.page');
  
  navBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      pages.forEach(p => p.classList.add('hidden'));
      navBtns.forEach(b => b.classList.remove('active'));
      
      document.getElementById(btn.dataset.page).classList.remove('hidden');
      btn.classList.add('active');
    });
  });

  // LOGOUT
  document.getElementById('logoutBtn').addEventListener('click', () => {
    signOut(auth).then(() => {
      window.location.href = 'login.html';
    });
  });

</script>
</body>
</html>
