<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Patanisha</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{background:#f5f5f5;padding:20px}
.container{max-width:1000px;margin:0 auto}
.header{background:linear-gradient(135deg,#FF5252,#FF1744);color:white;padding:20px;border-radius:15px;margin-bottom:20px;text-align:center}
.box{background:white;padding:20px;border-radius:15px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.box h3{margin-bottom:15px;color:#333;border-bottom:2px solid #FFD700;padding-bottom:8px}
input,select,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px;font-size:14px}
textarea{min-height:300px;resize:vertical;font-family:monospace;font-size:13px}
.btn{background:linear-gradient(135deg,#FFA500,#FF8C00);color:white;border:none;padding:12px 25px;border-radius:10px;font-weight:bold;cursor:pointer;margin:5px;font-size:14px}
.btn-success{background:linear-gradient(135deg,#00C853,#00BFA5)}
.btn-danger{background:linear-gradient(135deg,#FF5252,#FF1744)}
.btn-warning{background:linear-gradient(135deg,#F59E0B,#D97706);color:#000}
.btn-info{background:linear-gradient(135deg,#00BFFF,#1E90FF)}
.btn-yellow{background:#FFD700;color:#000;font-weight:700}

/* ANCHOR CARD */
.anchor-tabs{display:flex;gap:10px;margin-bottom:15px}
.anchor-tab{flex:1;padding:10px;background:#eee;border:none;border-radius:10px;font-weight:600;cursor:pointer}
.anchor-tab.active{background:#FFD700}
.anchor-card{background:#f8f8f8;padding:15px;border-radius:12px;margin:12px 0;display:flex;gap:15px;align-items:flex-start}
.anchor-avatar{width:70px;height:70px;border-radius:50%;position:relative;flex-shrink:0}
.anchor-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.online-dot{width:12px;height:12px;background:#4CAF50;border-radius:50%;position:absolute;bottom:2px;right:2px;border:2px solid #f8f8f8}
.anchor-info{flex:1}
.anchor-info-row{display:flex;justify-content:space-between;margin:4px 0;font-size:14px}
.anchor-id{background:white;padding:5px 12px;border-radius:20px;font-size:12px;display:inline-block;margin:5px 5px 5px 0}
.status-badge{padding:4px 10px;border-radius:12px;font-size:11px;font-weight:700}
.status-pending{background:#FFF3CD;color:#856404}
.status-approved{background:#D4EDDA;color:#155724}
.status-rejected{background:#F8D7DA;color:#721C24}

.stats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
.stat-card{background:#FFF7E6;padding:15px;border-radius:10px;text-align:center}
.stat-card b{font-size:24px;color:#FF8C00;display:block}
.alert{padding:12px;border-radius:8px;margin:10px 0;display:none}
.alert.success{background:#C8E6C9;color:#2E7D32}
</style>
</head>
<body>
<div class="container">

<div class="header">
  <h1>🔧 Patanisha Admin Panel</h1>
  <p>Anchor Management + Users + Data</p>
</div>

<div id="alert" class="alert"></div>

<div class="box">
  <h3>📊 Statistics</h3>
  <div class="stats">
    <div class="stat-card"><b id="totalUsers">0</b><span>Total Users</span></div>
    <div class="stat-card"><b id="totalAnchors">0</b><span>Total Anchors</span></div>
    <div class="stat-card"><b id="pendingAnchors">0</b><span>Pending Approval</span></div>
    <div class="stat-card"><b id="totalIncome">0</b><span>Total Income</span></div>
  </div>
</div>

<!-- ADDED: ANCHOR MANAGEMENT -->
<div class="box">
  <h3>👑 Anchor Management</h3>
  <input id="anchorSearch" placeholder="Search by Name or ID" onkeyup="loadAnchors()">
  
  <div class="anchor-tabs">
    <button class="anchor-tab active" onclick="switchAnchorTab('all', this)">All Anchors</button>
    <button class="anchor-tab" onclick="switchAnchorTab('male', this)">Male</button>
    <button class="anchor-tab" onclick="switchAnchorTab('female', this)">Female</button>
    <button class="anchor-tab" onclick="switchAnchorTab('pending', this)">Pending Approval</button>
  </div>
  
  <div id="anchorList">Loading...</div>
</div>

<div class="box">
  <h3>📄 Terms & Privacy Editor</h3>
  <div style="display:flex;gap:10px;margin-bottom:10px">
    <button class="btn" onclick="switchEditTab('terms', this)">Terms</button>
    <button class="btn" onclick="switchEditTab('privacy', this)">Privacy</button>
  </div>
  <textarea id="termsEditor"></textarea>
  <textarea id="privacyEditor" style="display:none"></textarea>
  <button class="btn btn-warning" onclick="saveContent()">💾 Save</button>
</div>

<div class="box">
  <h3>⚠️ Danger Zone</h3>
  <button class="btn btn-danger" onclick="clearAll()">RESET EVERYTHING</button>
</div>

</div>

<script>
const DEFAULT_TERMS = `KEKE Terms...`;
const DEFAULT_PRIVACY = `KEKE Privacy...`;

let users = JSON.parse(localStorage.getItem('patanishaUsers')) || [];
let maleUsers = JSON.parse(localStorage.getItem('patanishaUsers_male')) || [];
let currentAnchorTab = 'all';

function showAlert(msg, type){
  let alert = document.getElementById('alert');
  alert.className = 'alert ' + type;
  alert.innerText = msg;
  alert.style.display = 'block';
  setTimeout(()=>{alert.style.display='none'}, 3000);
}

// ANCHOR FUNCTIONS
function switchAnchorTab(tab, btn){
  currentAnchorTab = tab;
  document.querySelectorAll('.anchor-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  loadAnchors();
}

function loadAnchors(){
  let search = document.getElementById('anchorSearch').value.toLowerCase();
  let allAnchors = [
    ...users.map(u=>({...u, gender:'female'})),
    ...maleUsers.map(u=>({...u, gender:'male'}))
  ];
  
  // Filter by tab
  let filtered = allAnchors;
  if(currentAnchorTab === 'male') filtered = allAnchors.filter(u=>u.gender==='male');
  if(currentAnchorTab === 'female') filtered = allAnchors.filter(u=>u.gender==='female');
  if(currentAnchorTab === 'pending') filtered = allAnchors.filter(u=>u.gender==='female' && u.approved===false);
  
  // Filter by search
  if(search){
    filtered = filtered.filter(u=> 
      u.name.toLowerCase().includes(search) || 
      (u.id && u.id.toString().includes(search))
    );
  }
  
  updateStats(allAnchors);
  
  if(filtered.length === 0){
    document.getElementById('anchorList').innerHTML = '<p style="color:#999;text-align:center">No anchors found</p>';
    return;
  }
  
  let html = '';
  filtered.forEach(u=>{
    let income = u.income || 0;
    let totalCoins = u.coins || 0;
    let isOnline = u.online;
    let lastSeen = u.lastSeen || '2h ago';
    let bio = u.bio || u.desc || 'No bio';
    let id = u.id || 'N/A';
    let status = u.approved === true ? 'approved' : u.approved === false ? 'pending' : 'approved';
    
    html += `<div class="anchor-card">
      <div class="anchor-avatar">
        <img src="${u.avatar}">
        ${isOnline?'<div class="online-dot"></div>':''}
      </div>
      <div class="anchor-info">
        <div class="anchor-info-row"><span>NickName :</span> <b>${u.name} <span style="color:#888">(${u.gender})</span></b></div>
        <div class="anchor-info-row"><span>Income :</span> <b style="color:#00C853">${income.toFixed(2)}</b></div>
        <div class="anchor-info-row"><span>Total Coins :</span> <b>${totalCoins}</b></div>
        <div class="anchor-info-row"><span>Status :</span> <b style="color:${isOnline?'#4CAF50':'#999'}">${isOnline?'Online':`Last seen ${lastSeen}`}</b></div>
        <div class="anchor-info-row"><span>Bio :</span> <span style="font-size:12px">${bio.substring(0,50)}</span></div>
        <div>
          <span class="anchor-id">ID:${id}</span>
          ${u.gender==='female'?`<span class="status-badge status-${status}">${status.toUpperCase()}</span>`:''}
        </div>
        <div style="margin-top:8px">
          <button class="btn btn-yellow" onclick="viewAnchorDetails('${id}')">details</button>
          ${u.gender==='female' && status==='pending'?`
            <button class="btn btn-success" onclick="approveAnchor('${id}')">✅ Approve</button>
            <button class="btn btn-danger" onclick="rejectAnchor('${id}')">❌ Reject</button>
          `:''}
        </div>
      </div>
    </div>`;
  });
  document.getElementById('anchorList').innerHTML = html;
}

function approveAnchor(id){
  let u = users.find(x=>x.id==id);
  if(u){ u.approved = true; localStorage.setItem('patanishaUsers', JSON.stringify(users)); }
  showAlert('Anchor Approved', 'success');
  loadAnchors();
}

function rejectAnchor(id){
  let u = users.find(x=>x.id==id);
  if(u){ u.approved = false; localStorage.setItem('patanishaUsers', JSON.stringify(users)); }
  showAlert('Anchor Rejected', 'success');
  loadAnchors();
}

function viewAnchorDetails(id){
  let u = [...users, ...maleUsers].find(x=>x.id==id);
  if(!u) return;
  alert(`Anchor Details:\n\nName: ${u.name}\nID: ${u.id}\nGender: ${u.gender}\nCity: ${u.city}\nAge: ${u.age}\nIncome: ${u.income||0}\nCoins: ${u.coins||0}\nApproved: ${u.approved}\nBio: ${u.bio||u.desc||'None'}`);
}

function updateStats(allAnchors){
  let totalIncome = allAnchors.reduce((sum,u)=>sum+(u.income||0),0);
  document.getElementById('totalUsers').innerText = allAnchors.length;
  document.getElementById('totalAnchors').innerText = allAnchors.length;
  document.getElementById('pendingAnchors').innerText = users.filter(u=>u.approved===false).length;
  document.getElementById('totalIncome').innerText = totalIncome.toFixed(0);
}

// TERMS EDITOR
function switchEditTab(tab, btn){
  document.getElementById('termsEditor').style.display = tab==='terms'? 'block' : 'none';
  document.getElementById('privacyEditor').style.display = tab==='privacy'? 'block' : 'none';
}

function saveContent(){
  localStorage.setItem('keke_terms', document.getElementById('termsEditor').value);
  localStorage.setItem('keke_privacy', document.getElementById('privacyEditor').value);
  showAlert('Saved', 'success');
}

function clearAll(){
  if(confirm('RESET EVERYTHING?')){
    localStorage.clear();
    location.reload();
  }
}

// INIT
document.getElementById('termsEditor').value = localStorage.getItem('keke_terms') || DEFAULT_TERMS;
document.getElementById('privacyEditor').value = localStorage.getItem('keke_privacy') || DEFAULT_PRIVACY;
loadAnchors();
</script>
</body>
</html>
