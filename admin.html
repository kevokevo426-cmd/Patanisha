<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patanisha - Home</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f0f2f5; }
    
    #loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-size: 20px;
      color: #E91E63;
    }
    
    #app { display: none; }
    
    .header {
      background: #E91E63;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }
    
    .nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: white;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      border-top: 1px solid #ddd;
    }
    
    .nav button {
      background: none;
      border: none;
      font-size: 14px;
      color: #666;
      cursor: pointer;
    }
    
    .nav button.active { color: #E91E63; font-weight: bold; }
    
    .page { padding: 20px; padding-bottom: 80px; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div id="loading">Loading Patanisha...</div>

  <div id="app">
    <div class="header">Patanisha ❤️</div>
    
    <div id="home-page" class="page">
      <h2>Welcome Home!</h2>
      <p>Find and connect with people near you.</p>
    </div>
    
    <div id="chat-page" class="page hidden">
      <h2>Chats</h2>
      <p>Your conversations will appear here.</p>
    </div>
    
    <div id="me-page" class="page hidden">
      <h2>My Profile</h2>
      <p id="user-email"></p>
      <button id="logoutBtn" style="background:red;color:white;padding:10px;border:none;border-radius:5px;margin-top:10px;">Logout</button>
    </div>

    <div class="nav">
      <button class="nav-btn active" data-page="home-page">Home</button>
      <button class="nav-btn" data-page="chat-page">Chat</button>
      <button class="nav-btn" data-page="me-page">Me</button>
    </div>
  </div>


<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  // PASTE YOUR FIREBASE CONFIG HAPA
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // 1. CHECK LOGIN - HII NDIO FIX YA KUSTUCK
  onAuthStateChanged(auth, (user) => {
    if (user) {
      // User ame-login
      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.getElementById('user-email').innerText = "Email: " + user.email;
    } else {
      // Hakuna user - RUDI LOGIN
      window.location.href = 'login.html';
    }
  });

  // 2. NAVIGATION
  const navBtns = document.querySelectorAll('.nav-btn');
  const pages = document.querySelectorAll('.page');
  
  navBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      pages.forEach(p => p.classList.add('hidden'));
      navBtns.forEach(b => b.classList.remove('active'));
      
      document.getElementById(btn.dataset.page).classList.remove('hidden');
      btn.classList.add('active');
    });
  });

  // 3. LOGOUT
  document.getElementById('logoutBtn').addEventListener('click', () => {
    signOut(auth);
  });

</script>
</body>
</html>
