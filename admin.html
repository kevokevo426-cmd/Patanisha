<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patanisha Admin</title>
<style>
body{font-family:sans-serif;background:#f5f5f5;padding:20px}
.container{max-width:1000px;margin:0 auto;background:white;padding:20px;border-radius:10px}
h1{color:#FF8C00;margin-bottom:20px}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;text-align:left;border-bottom:1px solid #eee}
th{background:#FFD700}
.btn{padding:6px 12px;border:none;border-radius:6px;cursor:pointer;font-size:12px}
.btn-ban{background:#FF5252;color:white}
.btn-vip{background:#9370DB;color:white}
.btn-add{background:#00C853;color:white}
.stats{display:flex;gap:15px;margin-bottom:20px}
.stat-card{background:linear-gradient(135deg,#FFD700,#FFA500);padding:15px;border-radius:10px;flex:1;color:#000}
</style>
</head>
<body>
<div class="container">
  <h1>🔥 Patanisha Admin Panel</h1>
  
  <div class="stats">
    <div class="stat-card">
      <b>Total Users</b>
      <h2 id="totalUsers">0</h2>
    </div>
    <div class="stat-card">
      <b>Online Now</b>
      <h2 id="onlineUsers">0</h2>
    </div>
    <div class="stat-card">
      <b>VIP Users</b>
      <h2 id="vipUsers">0</h2>
    </div>
  </div>

  <h3>All Users</h3>
  <table id="userTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Friends</th>
        <th>VIP</th>
        <th>City</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
let users = JSON.parse(localStorage.getItem('patanishaUsers')) || [];

function loadAdmin(){
  document.getElementById('totalUsers').innerText = users.length;
  document.getElementById('onlineUsers').innerText = users.length; // demo
  document.getElementById('vipUsers').innerText = users.filter(u => u.friends >= 10).length;
  
  let tbody = '';
  users.forEach(u => {
    let vip = u.friends >= 50 ? 'VIP5' : u.friends >= 40 ? 'VIP4' : u.friends >= 30 ? 'VIP3' : u.friends >= 20 ? 'VIP2' : u.friends >= 10 ? 'VIP1' : '-';
    tbody += `
    <tr>
      <td>${u.id}</td>
      <td>${u.name}</td>
      <td>${u.friends}</td>
      <td>${vip}</td>
      <td>${u.city}</td>
      <td>
        <button class="btn btn-add" onclick="add5('${u.name}')">+5 Friends</button>
        <button class="btn btn-vip" onclick="makeVIP('${u.name}')">Make VIP</button>
        <button class="btn btn-ban" onclick="ban('${u.name}')">Ban</button>
      </td>
    </tr>`
  });
  document.querySelector('#userTable tbody').innerHTML = tbody;
}

function add5(name){
  let u = users.find(x=>x.name==name);
  u.friends += 5;
  localStorage.setItem('patanishaUsers', JSON.stringify(users));
  loadAdmin();
  alert(`${name} now has ${u.friends} friends`);
}
function makeVIP(name){
  let u = users.find(x=>x.name==name);
  u.friends = 50;
  localStorage.setItem('patanishaUsers', JSON.stringify(users));
  loadAdmin();
}
function ban(name){
  users = users.filter(x=>x.name!=name);
  localStorage.setItem('patanishaUsers', JSON.stringify(users));
  loadAdmin();
}

loadAdmin();
</script>
</body>
</html>
