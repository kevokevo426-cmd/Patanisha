<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Patanisha</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{background:#f5f5f5;padding:20px}
.container{max-width:800px;margin:0 auto}
.header{background:linear-gradient(135deg,#FF5252,#FF1744);color:white;padding:20px;border-radius:15px;margin-bottom:20px;text-align:center}
.header h1{font-size:24px;margin-bottom:5px}
.header p{font-size:14px;opacity:0.9}
.box{background:white;padding:20px;border-radius:15px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.box h3{margin-bottom:15px;color:#333;border-bottom:2px solid #FFD700;padding-bottom:8px}
input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px;font-size:14px}
.btn{background:linear-gradient(135deg,#FFA500,#FF8C00);color:white;border:none;padding:12px 25px;border-radius:10px;font-weight:bold;cursor:pointer;margin:5px 5px 5px 0;font-size:14px}
.btn:hover{transform:scale(1.02)}
.btn-danger{background:linear-gradient(135deg,#FF5252,#FF1744)}
.btn-success{background:linear-gradient(135deg,#00C853,#00BFA5)}
.btn-info{background:linear-gradient(135deg,#00BFFF,#1E90FF)}
.user-item{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid #eee;border-radius:10px;margin:8px 0}
.user-info{flex:1}
.user-info b{display:block;font-size:15px}
.user-info span{font-size:12px;color:#666}
.del-btn{background:#ff5252;color:white;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stat-card{background:#FFF7E6;padding:15px;border-radius:10px;text-align:center}
.stat-card b{font-size:24px;color:#FF8C00;display:block}
.stat-card span{font-size:12px;color:#666}
.back-link{display:inline-block;margin-top:15px;color:#FF8C00;text-decoration:none;font-weight:bold}
.alert{padding:12px;border-radius:8px;margin:10px 0;display:none}
.alert.success{background:#C8E6C9;color:#2E7D32}
.alert.error{background:#FFCDD2;color:#C62828}
</style>
</head>
<body>
<div class="container">

<div class="header">
  <h1>🔧 Patanisha Admin Panel</h1>
  <p>Manage users, chats, and app data</p>
</div>

<div id="alert" class="alert"></div>

<div class="box">
  <h3>📊 Statistics</h3>
  <div class="stats">
    <div class="stat-card">
      <b id="totalUsers">0</b>
      <span>Total Users</span>
    </div>
    <div class="stat-card">
      <b id="totalChats">0</b>
      <span>Active Chats</span>
    </div>
    <div class="stat-card">
      <b id="blockedUsers">0</b>
      <span>Blocked</span>
    </div>
  </div>
</div>

<div class="box">
  <h3>➕ Add New User</h3>
  <input id="name" placeholder="Full Name">
  <input id="city" placeholder="City e.g. Ruiru, Nairobi">
  <input id="age" placeholder="Age" type="number">
  <input id="friends" placeholder="Friends Count" type="number" value="0">
  <select id="level">
    <option value="1">Level 1</option>
    <option value="5">Level 5</option>
    <option value="10">Level 10</option>
    <option value="16">Level 16</option>
  </select>
  <button class="btn btn-success" onclick="addUser()">Add User</button>
</div>

<div class="box">
  <h3>👥 Manage Users</h3>
  <div id="userList">Loading...</div>
</div>

<div class="box">
  <h3>💬 Chat Management</h3>
  <button class="btn btn-info" onclick="viewChats()">View All Chats</button>
  <button class="btn btn-danger" onclick="clearChats()">Clear All Chats</button>
  <div id="chatList" style="margin-top:15px"></div>
</div>

<div class="box">
  <h3>⚠️ Danger Zone</h3>
  <button class="btn btn-danger" onclick="clearUsers()">Reset All Users</button>
  <button class="btn btn-danger" onclick="clearBlocked()">Clear Blocked List</button>
  <button class="btn btn-danger" onclick="clearAll()">RESET EVERYTHING</button>
</div>

<a href="/" class="back-link">← Back to App</a>

</div>

<script>
let users = JSON.parse(localStorage.getItem('patanishaUsers')) || [];
let chats = JSON.parse(localStorage.getItem('patanishaChats')) || {};
let blocked = JSON.parse(localStorage.getItem('blockedUsers')) || [];

function showAlert(msg, type){
  let alert = document.getElementById('alert');
  alert.className = 'alert ' + type;
  alert.innerText = msg;
  alert.style.display = 'block';
  setTimeout(()=>{alert.style.display='none'}, 3000);
}

function saveAll(){
  localStorage.setItem('patanishaUsers', JSON.stringify(users));
  localStorage.setItem('patanishaChats', JSON.stringify(chats));
  localStorage.setItem('blockedUsers', JSON.stringify(blocked));
  updateStats();
  loadUsers();
}

function updateStats(){
  document.getElementById('totalUsers').innerText = users.length;
  document.getElementById('totalChats').innerText = Object.keys(chats).length;
  document.getElementById('blockedUsers').innerText = blocked.length;
}

function addUser(){
  let name = document.getElementById('name').value.trim();
  let city = document.getElementById('city').value.trim();
  let age = document.getElementById('age').value;
  let friends = document.getElementById('friends').value;
  let level = document.getElementById('level').value;
  
  if(!name ||!city ||!age) return showAlert('Please fill all required fields', 'error');
  
  users.push({
    name: name,
    avatar: "https://i.pravatar.cc/100?u=" + name.replace(/\s/g,''),
    friends: parseInt(friends),
    level: parseInt(level),
    distance: "1km",
    age: parseInt(age),
    city: city,
    svip: parseInt(level) > 10? "SVIP2" : ""
  });
  
  saveAll();
  showAlert('User added successfully!', 'success');
  document.getElementById('name').value = '';
  document.getElementById('city').value = '';
  document.getElementById('age').value = '';
}

function loadUsers(){
  if(users.length === 0){
    document.getElementById('userList').innerHTML = '<p style="color:#999;text-align:center">No users found</p>';
    return;
  }
  let html = '';
  users.forEach((u, index)=>{
    html += `<div class="user-item">
      <div class="user-info">
        <b>${u.name}</b>
        <span>${u.city} • ${u.age}yrs • ${u.friends} friends • Lv${u.level}</span>
      </div>
      <button class="del-btn" onclick="deleteUser(${index})">Delete</button>
    </div>`;
  });
  document.getElementById('userList').innerHTML = html;
}

function deleteUser(index){
  if(confirm('Delete ' + users[index].name + '?')){
    users.splice(index,1);
    saveAll();
    showAlert('User deleted', 'success');
  }
}

function viewChats(){
  let chatKeys = Object.keys(chats);
  if(chatKeys.length === 0){
    document.getElementById('chatList').innerHTML = '<p style="color:#999">No chats yet</p>';
    return;
  }
  let html = '<h4 style="margin-bottom:10px">Active Chats:</h4>';
  chatKeys.forEach(name=>{
    let msgs = chats[name].length;
    let lastMsg = chats[name][msgs-1]?.text || '';
    html += `<div class="user-item">
      <div class="user-info">
        <b>${name}</b>
        <span>${msgs} messages • Last: ${lastMsg.substring(0,30)}</span>
      </div>
      <button class="del-btn" onclick="deleteChat('${name}')">Clear</button>
    </div>`;
  });
  document.getElementById('chatList').innerHTML = html;
}

function deleteChat(name){
  delete chats[name];
  saveAll();
  viewChats();
  showAlert('Chat cleared', 'success');
}

function clearChats(){
  if(confirm('Clear ALL chats?')){
    chats = {};
    saveAll();
    viewChats();
    showAlert('All chats cleared', 'success');
  }
}

function clearUsers(){
  if(confirm('Reset all users to demo data?')){
    localStorage.removeItem('patanishaUsers');
    location.reload();
  }
}

function clearBlocked(){
  if(confirm('Clear blocked users list?')){
    blocked = [];
    saveAll();
    showAlert('Blocked list cleared', 'success');
  }
}

function clearAll(){
  if(confirm('⚠️ THIS WILL DELETE EVERYTHING! Are you sure?')){
    localStorage.clear();
    showAlert('Everything reset. Reloading...', 'success');
    setTimeout(()=>location.reload(), 1000);
  }
}

updateStats();
loadUsers();
</script>
</body>
</html>
